---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  SECRETS_FILE: "{{.ROOT_DIR}}/homelab.sops.env"

tasks:
  run:
    desc: "Run a task with provisioning secrets injected: task secrets:run -- <task> [VAR=value ...]"
    dir: "{{.ROOT_DIR}}"
    interactive: true
    vars:
      CMD: "{{.TARGET | default .CLI_ARGS}}"
    preconditions:
      - sh: test -n "{{.CMD}}"
        msg: "usage: task secrets:run -- <task> [VAR=value ...]"
    cmds:
      - |
        if [ -n "${HOMELAB_SECRETS_LOADED:-}" ]; then
          exec task {{.CMD}}
        fi
        if [ -f "{{.SECRETS_FILE}}" ]; then
          exec sops exec-env "{{.SECRETS_FILE}}" 'HOMELAB_SECRETS_LOADED=1 task {{.CMD}}'
        fi
        echo "warning: {{.SECRETS_FILE}} missing, using ambient environment (run: task secrets:migrate)" >&2
        exec task {{.CMD}}

  edit:
    desc: Edit provisioning secrets in $EDITOR (decrypted in memory, re-encrypted on save)
    dir: "{{.ROOT_DIR}}"
    interactive: true
    cmds:
      - sops "{{.SECRETS_FILE}}"

  keys:
    desc: List secret names without decrypting
    dir: "{{.ROOT_DIR}}"
    cmds:
      - grep -oE '^[A-Z0-9_]+' "{{.SECRETS_FILE}}" | grep -v '^sops_'

  check:
    desc: Fail if plaintext secrets are present in committed env files
    dir: "{{.ROOT_DIR}}"
    cmds:
      - bash scripts/secrets/check-envrc.sh
