version: '3'

set: [pipefail]
shopt: [globstar]

includes:
  kubernetes:
    taskfile: kubernetes/Taskfile.yml
  containers:
    taskfile: containers/Taskfile.yml
  network:
    taskfile: rack/network/Taskfile.yml
  platform:
    taskfile: platform/Taskfile.yml
  machines:
    dir: machines
    taskfile: machines/Taskfile.yml
  ansible:
    dir: ansible
    taskfile: ansible/Taskfile.yml

dotenv: [
  './kubernetes/.env',
  './containers/.env',
  './platform/observability/.env',
]

tasks:
  help:
    silent: true
    cmds: [ "task -l" ]

  default:
    silent: true
    cmd: task --list

  noop:
    internal: true
    silent: true
    cmd: noop() { :; }

  deploy-kubernetes:
    cmds:
      - task: kubernetes:provision-application
      - task: kubernetes:provision-mlops
      - task: kubernetes:bootstrap-cluster
        vars: { CLUSTER: mlops }
      - task: kubernetes:bootstrap-cluster
        vars: { CLUSTER: application }
      - task: kubernetes:connect-clusters
      - task: kubernetes:kubectl:merge-kubeconfig
      - task: kubernetes:wait-for-external-certificate
        vars: { CLUSTER: application }
      - task: kubernetes:wait-for-external-certificate
        vars: { CLUSTER: mlops }
      - task: platform:deploy
        vars: { CLUSTER: application }
      - task: platform:deploy
        vars: { CLUSTER: mlops }
      - task: deploy-cloudflare-tunnel

  deploy-cloudflare-tunnel:
    desc: Apply the Cloudflare tunnel remote ingress config (terraform/cloudflare_tunnel.tf). Idempotent.
    dir: terraform
    vars:
      # Prefer env/CLI override. Otherwise read the pinned mlops external-gateway
      # LB IP from kubernetes/clusters/mlops/environment.yaml (Cilium LB-IPAM source of truth).
      MLOPS_EXTERNAL_GATEWAY_IP:
        sh: |
          if [ -n "${MLOPS_EXTERNAL_GATEWAY_IP:-}" ]; then
            printf '%s' "$MLOPS_EXTERNAL_GATEWAY_IP"
          else
            grep -E '^\s*loadBalancerIP:' "{{.TASKFILE_DIR}}/kubernetes/clusters/mlops/environment.yaml" \
              | head -1 \
              | sed -E 's/.*"([^"]+)".*/\1/'
          fi
    requires:
      vars:
        - CLOUDFLARE_TUNNEL_ID
        - CLOUDFLARE_ACCOUNT_TAG
    env:
      TF_VAR_homelab_external_tunnel_id: '{{.CLOUDFLARE_TUNNEL_ID}}'
      TF_VAR_cloudflare_account_id: '{{.CLOUDFLARE_ACCOUNT_TAG}}'
      TF_VAR_mlops_external_gateway_ip: '{{.MLOPS_EXTERNAL_GATEWAY_IP}}'
    preconditions:
      - sh: test -n '{{.MLOPS_EXTERNAL_GATEWAY_IP}}'
        msg: "MLOPS_EXTERNAL_GATEWAY_IP is empty — set it or pin externalGateway.loadBalancerIP in kubernetes/clusters/mlops/environment.yaml"
    cmds:
      - echo "Tunnel origin https://{{.MLOPS_EXTERNAL_GATEWAY_IP}} (n8n.teaglebuilt.tech)"
      - terraform init -input=false
      - terraform apply -auto-approve -input=false

  destroy-kubernetes:
    cmds:
      - task: kubernetes:destroy-mlops
      - task: kubernetes:destroy-application

  spin-up-*:
    summary: Used for launching any platform service locally.
    vars:
      STACK: '{{index .MATCH 0}}'
    cmds:
      - echo "Starting stack [{{.STACK}}]"
      - docker compose up -d platform/{{.STACK}}

  serve-docs:
    cmds:
      - task: docs:serve
