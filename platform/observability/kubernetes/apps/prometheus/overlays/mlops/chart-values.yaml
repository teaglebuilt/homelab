---
# Spoke cluster: PrometheusAgent only. Scrape local GPU/vLLM targets and
# remote_write to the application hub. No local TSDB, rules, or exporters.
defaultRules:
  create: false
alertmanager:
  enabled: false
grafana:
  enabled: false
nodeExporter:
  enabled: false
kubeStateMetrics:
  enabled: false
kubeApiServer:
  enabled: false
kubelet:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false
kubernetesServiceMonitors:
  enabled: false
crds:
  enabled: true
