---
manager:
  collectorImage:
    repository: otel/opentelemetry-collector-k8s
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
# cert-manager (not autoGenerateCert): Helmfile has no live secret lookup on
# render, so autoGenerateCert would mint a new CA every sync and break the
# mutating webhook until the operator reloads.
admissionWebhooks:
  certManager:
    enabled: true
  autoGenerateCert:
    enabled: false
