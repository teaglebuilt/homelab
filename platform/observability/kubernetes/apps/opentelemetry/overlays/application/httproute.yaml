---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otel-collector-otlp-http
  namespace: observability
  annotations:
    external-dns.alpha.kubernetes.io/hostname: otel.homelab.internal
spec:
  parentRefs:
  - name: homelab-internal-gateway
    namespace: kube-system
    sectionName: http
  hostnames:
    - otel.homelab.internal
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/metrics
    backendRefs:
    - name: otel-collector-collector
      port: 4318
