---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Chart-free: mesh Service + ServiceMonitor. Operator is Helmfile stage 04.
# OpenTelemetryCollector CR (otel-collector.yaml) is applied by the
# open-telemetry postsync hook after webhook readiness — same apply stream
# races the mutating webhook (failurePolicy=Fail).
resources:
  - ../../base
  - servicemonitor.yaml
