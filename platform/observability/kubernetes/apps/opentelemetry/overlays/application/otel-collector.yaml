---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: observability
spec:
  mode: deployment
  image: otel/opentelemetry-collector-contrib:latest
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
      attributes:
        actions:
          - key: service.name
            action: upsert
            from_attribute: service.name
      # sumconnector emits DELTA; remote write needs cumulative. max_stale must
      # outlive the gaps between sparse LLM calls or the stream restarts at zero.
      deltatocumulative:
        max_stale: 2h
    connectors:
      spanmetrics:
        namespace: otelcol
        histogram:
          unit: s
          explicit:
            buckets: [2ms, 4ms, 8ms, 16ms, 32ms, 64ms, 128ms, 256ms, 512ms, 1024ms, 2048ms, 4096ms, 8192ms, 16384ms, 32768ms, 65536ms, 131072ms]
        # Keep in sync with tempo metricsGenerator.processor.span_metrics.dimensions.
        # Token counts belong in the sum connector below, never here as dimensions.
        dimensions:
          - name: gen_ai.request.model
          - name: gen_ai.provider.name
          - name: gen_ai.operation.name
        exemplars:
          enabled: true
        metrics_flush_interval: 15s
        aggregation_temporality: AGGREGATION_TEMPORALITY_CUMULATIVE
      sum:
        spans:
          gen_ai.usage.input_tokens:
            source_attribute: gen_ai.usage.input_tokens
            conditions:
              - span.attributes["gen_ai.usage.input_tokens"] != nil
            attributes:
              - key: gen_ai.request.model
                default_value: unknown
          gen_ai.usage.output_tokens:
            source_attribute: gen_ai.usage.output_tokens
            conditions:
              - span.attributes["gen_ai.usage.output_tokens"] != nil
            attributes:
              - key: gen_ai.request.model
                default_value: unknown
          gen_ai.usage.cache_read.input_tokens:
            source_attribute: gen_ai.usage.cache_read.input_tokens
            conditions:
              - span.attributes["gen_ai.usage.cache_read.input_tokens"] != nil
            attributes:
              - key: gen_ai.request.model
                default_value: unknown
          gen_ai.usage.cache_write.input_tokens:
            source_attribute: gen_ai.usage.cache_write.input_tokens
            conditions:
              - span.attributes["gen_ai.usage.cache_write.input_tokens"] != nil
            attributes:
              - key: gen_ai.request.model
                default_value: unknown
          gen_ai.usage.reasoning.output_tokens:
            source_attribute: gen_ai.usage.reasoning.output_tokens
            conditions:
              - span.attributes["gen_ai.usage.reasoning.output_tokens"] != nil
            attributes:
              - key: gen_ai.request.model
                default_value: unknown
    exporters:
      otlp/tempo:
        endpoint: http://tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/loki:
        # Push via the loki gateway (nginx) which routes /otlp/v1/logs to the write
        # path. Works for SingleBinary and SimpleScalable alike.
        endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
        tls:
          insecure: true
        headers:
          X-Scope-OrgID: "1"
      prometheusremotewrite:
        endpoint: http://prometheus-community-kube-prometheus.observability.svc.cluster.local:9090/api/v1/write
        tls:
          insecure: true
        resource_to_telemetry_conversion:
          enabled: true
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, attributes]
          exporters: [spanmetrics, sum, debug, otlp/tempo]
        # otlp alongside spanmetrics: the mlops agent forwards substrate/kagent
        # SDK metrics here, and without the receiver this pipeline would answer
        # them "Unimplemented" exactly as the agent did before.
        metrics:
          receivers: [spanmetrics, otlp]
          processors: [batch]
          exporters: [prometheus, prometheusremotewrite, debug]
        # Separate pipeline so deltatocumulative never sees the already-cumulative
        # spanmetrics series.
        metrics/tokens:
          receivers: [sum]
          processors: [deltatocumulative, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/loki, debug]
