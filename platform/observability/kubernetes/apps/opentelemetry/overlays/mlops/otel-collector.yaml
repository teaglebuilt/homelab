apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  # NOT "otel-collector": that instance label (observability.otel-collector) is
  # what the otel-collector-mesh global Service selects. Naming this agent
  # differently keeps the mesh Service backend-less on mlops (so it routes to
  # application), avoiding a self-referential loop when the agent forwards to it.
  name: otel-agent
  namespace: observability
spec:
  mode: deployment
  image: otel/opentelemetry-collector-contrib:latest
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch:
        timeout: 10s
        send_batch_size: 1024
      filter/kagent_taskstore:
        error_mode: ignore
        traces:
          span:
            - IsMatch(
                span.attributes["rpc.method"],
                "^kagent\\.api\\.v1alpha1\\.TaskStoreService/"
              )
      filter/not_from_agentevals:
        error_mode: ignore
        logs:
          log_record:
            - resource.attributes["service.name"] == "agentevals"

      filter/only_from_agentevals:
        error_mode: ignore
        logs:
          log_record:
            - resource.attributes["service.name"] != "agentevals"
      transform/claude_code:
        error_mode: ignore
        trace_statements:
          - context: span
            conditions:
              - instrumentation_scope.name == "com.anthropic.claude_code.tracing" and resource.attributes["kagent.genai.producer"] == nil
            statements:
              - set(span.attributes["gen_ai.operation.name"], "execute_tool") where span.name == "claude_code.tool"
              - set(span.attributes["gen_ai.tool.name"], span.attributes["tool_name"]) where span.name == "claude_code.tool"
              - replace_pattern(span.attributes["gen_ai.tool.name"], "^mcp__.+?__", "")
              - set(span.attributes["gen_ai.operation.name"], "chat") where span.name == "claude_code.llm_request"
              - set(span.attributes["gen_ai.response.model"], span.attributes["model"]) where span.name == "claude_code.llm_request"
              - set(span.attributes["gen_ai.usage.input_tokens"], span.attributes["input_tokens"] + span.attributes["cache_read_tokens"] + span.attributes["cache_creation_tokens"]) where span.name == "claude_code.llm_request"
              - set(span.attributes["gen_ai.usage.cache_read.input_tokens"], span.attributes["cache_read_tokens"]) where span.name == "claude_code.llm_request"
              - set(span.attributes["gen_ai.usage.cache_write.input_tokens"], span.attributes["cache_creation_tokens"]) where span.name == "claude_code.llm_request"
              - set(span.attributes["gen_ai.usage.output_tokens"], span.attributes["output_tokens"]) where span.name == "claude_code.llm_request"
    exporters:
      otlp/gateway:
        endpoint: otel-collector-mesh.observability.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp/agentevals:
        endpoint: http://agentevals.ai.svc.cluster.local:4318
      debug:
        verbosity: normal
    service:
      pipelines:
        # Gateway + debug stay on the primary pipeline. AgentEvals gets its own
        # branch so a broken agentevals exporter cannot block Tempo/Loki export.
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/kagent_taskstore, batch]
          exporters: [otlp/gateway, debug]
        traces/agentevals:
          receivers: [otlp]
          processors: [memory_limiter, filter/kagent_taskstore, batch]
          exporters: [otlphttp/agentevals]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/gateway]
        logs/agentevals:
          receivers: [otlp]
          processors: [memory_limiter, filter/not_from_agentevals, batch]
          exporters: [otlphttp/agentevals]
