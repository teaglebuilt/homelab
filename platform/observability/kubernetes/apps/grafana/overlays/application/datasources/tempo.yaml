---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tempo
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    orgId: 1
    url: http://tempo.observability.svc.cluster.local:3200
    basicAuth: false
    isDefault: false
    editable: true
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      tracesToMetrics:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: false
        tags:
          - key: k8s.cluster.name
            value: cluster
          - key: service.name
            value: service_name
          - key: k8s.namespace.name
            value: namespace
          - key: k8s.pod.name
            value: pod
