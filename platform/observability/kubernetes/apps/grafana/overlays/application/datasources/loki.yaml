---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: Loki
    uid: loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki-gateway.observability.svc.cluster.local
    basicAuth: false
    isDefault: false
    editable: true
    jsonData:
      # logs -> traces: Vector/OTLP land trace_id as Loki structured metadata.
      # With matcherType=label, matcherRegex is the field name (not a line regex).
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "${__value.raw}"
          urlDisplayLabel: View Trace
