---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gen-ai-requests
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "ai-gateway access logs from Loki (Vector). Stream labels only in {}; container is structured metadata. route/status come from logfmt/regexp on the message line.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "Access-log lines with route= in the selected range.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 100
                  },
                  {
                    "color": "red",
                    "value": 1000
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "editorMode": "code",
              "expr": "sum(count_over_time({cluster=~\"$cluster\", service_name=\"ai-gateway\"} | container=\"agentgateway\" |= \"route=\" | json | line_format \"{{.message}}\" | logfmt | route=~\"$route\" [$__range]))",
              "queryType": "instant",
              "refId": "A"
            }
          ],
          "title": "Requests ($__range)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "Access-log rate by HTTP status.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 18,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "editorMode": "code",
              "expr": "sum by (status) (rate({cluster=~\"$cluster\", service_name=\"ai-gateway\"} | container=\"agentgateway\" |= \"http.status=\" |= \"route=\" | json | line_format \"{{.message}}\" | logfmt | route=~\"$route\" | regexp \"http\\\\.status=(?P<status>\\\\d+)\" [$__interval]))",
              "legendFormat": "{{status}}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Request rate by status",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "Access-log counts by Gateway API route name.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                }
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "id": 3,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "editorMode": "code",
              "expr": "sum by (route) (count_over_time({cluster=~\"$cluster\", service_name=\"ai-gateway\"} | container=\"agentgateway\" |= \"route=\" | json | line_format \"{{.message}}\" | logfmt | route=~\"$route\" [$__interval]))",
              "legendFormat": "{{route}}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Requests by route",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "Access-log rate by route (same filter as the count panel).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineWidth": 1,
                "showPoints": "never"
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "id": 4,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "editorMode": "code",
              "expr": "sum by (route) (rate({cluster=~\"$cluster\", service_name=\"ai-gateway\"} | container=\"agentgateway\" |= \"route=\" | json | line_format \"{{.message}}\" | logfmt | route=~\"$route\" [$__interval]))",
              "legendFormat": "{{route}}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Access log rate by route",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "Raw ai-gateway access lines (route=).",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "id": 5,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": true,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "editorMode": "code",
              "expr": "{cluster=~\"$cluster\", service_name=\"ai-gateway\"} | container=\"agentgateway\" |= \"route=\" | json | line_format \"{{.message}}\" | logfmt | route=~\"$route\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Access log lines",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "ai",
        "agentgateway",
        "loki",
        "access-logs"
      ],
      "templating": {
        "list": [
          {
            "allValue": ".+",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "definition": "label_values({service_name=\"ai-gateway\"}, cluster)",
            "includeAll": true,
            "label": "cluster",
            "multi": true,
            "name": "cluster",
            "query": "label_values({service_name=\"ai-gateway\"}, cluster)",
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "selected": false,
              "text": ".+",
              "value": ".+"
            },
            "label": "route",
            "name": "route",
            "options": [
              {
                "selected": true,
                "text": ".+",
                "value": ".+"
              }
            ],
            "query": ".+",
            "type": "textbox"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "AI Traffic",
      "uid": "gen-ai-requests-loki",
      "weekStart": ""
    }
