---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: gen-ai-requests
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "gen_ai telemetry for the AI stack. Cost tiles price the otel-collector sum connector token counters at query time against the git-versioned rate card in ai-cost.rules. Self-hosted models have no rate-card row and are excluded from spend. Claude Code reports its own USD figure via claude_code.cost.usage when its telemetry is exported. Model panels use the otel-collector spanmetrics connector (otelcol_calls_total, otelcol_duration_seconds), whose gen_ai dimensions are gen_ai.request.model, gen_ai.provider.name and gen_ai.operation.name. Gateway panels use agentgateway's own counters and are pinned to one scrape job. Loki and Tempo retain 24h; Prometheus 15d.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "Cost and token usage",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 101,
          "type": "stat",
          "title": "Estimated spend ($__range)",
          "description": "Estimated spend over the dashboard range. Computed at query time from the gen_ai_usage_* counters x the ai:model_price_usd_per_mtok rate card (ai-cost.rules). Token samples reach Prometheus after the fact, so recording rules over them miss data. Cache tokens are carved out of input and priced at their own rates.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "currencyUSD",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 25
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "((sum (clamp_min(label_replace(sum by (gen_ai_request_model) (increase(gen_ai_usage_input_tokens_total[$__range])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") - on (model) (label_replace(sum by (gen_ai_request_model) (increase(gen_ai_usage_cache_read_input_tokens_total[$__range])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") or label_replace(sum by (gen_ai_request_model) (increase(gen_ai_usage_input_tokens_total[$__range])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * 0) - on (model) (label_replace(sum by (gen_ai_request_model) (increase(gen_ai_usage_cache_write_input_tokens_total[$__range])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") or label_replace(sum by (gen_ai_request_model) (increase(gen_ai_usage_input_tokens_total[$__range])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * 0), 0) * on (model) group_left () ai:model_price_usd_per_mtok{kind=\"input\"}) or vector(0)) + (sum (label_replace(sum by (gen_ai_request_model) (increase(gen_ai_usage_output_tokens_total[$__range])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * on (model) group_left () ai:model_price_usd_per_mtok{kind=\"output\"}) or vector(0)) + (sum (label_replace(sum by (gen_ai_request_model) (increase(gen_ai_usage_cache_read_input_tokens_total[$__range])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * on (model) group_left () ai:model_price_usd_per_mtok{kind=\"cache_read\"}) or vector(0)) + (sum (label_replace(sum by (gen_ai_request_model) (increase(gen_ai_usage_cache_write_input_tokens_total[$__range])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * on (model) group_left () ai:model_price_usd_per_mtok{kind=\"cache_write_5m\"}) or vector(0))) / 1e6",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 102,
          "type": "stat",
          "title": "Claude Code spend ($__range)",
          "description": "claude_code.cost.usage, the USD figure Claude Code reports itself. Authoritative where it exists: no price table involved. Empty until Claude Code telemetry is exported to the collector.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 5,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "currencyUSD",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 25
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(increase({__name__=~\"claude_code_cost_usage.*\"}[$__range])) or vector(0)",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 103,
          "type": "stat",
          "title": "Input tokens",
          "description": "Summed gen_ai.usage.input_tokens across all models.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 10,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "(sum(increase({__name__=~\"gen_ai_usage_input_tokens(_total)?\"}[$__range])) or vector(0))",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 104,
          "type": "stat",
          "title": "Output tokens",
          "description": "Summed gen_ai.usage.output_tokens across all models.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 14,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "(sum(increase({__name__=~\"gen_ai_usage_output_tokens(_total)?\"}[$__range])) or vector(0))",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 105,
          "type": "stat",
          "title": "Cache read share",
          "description": "Cache-read tokens as a fraction of input tokens. High is good: cached input bills at a tenth of the normal rate.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.6
                  }
                ]
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "(sum(increase({__name__=~\"gen_ai_usage_cache_read_input_tokens(_total)?\"}[$__range])) or vector(0)) / clamp_min((sum(increase({__name__=~\"gen_ai_usage_input_tokens(_total)?\"}[$__range])) or vector(0)), 1)",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 106,
          "type": "stat",
          "title": "Tokens per call",
          "description": "(input + output) / count of chat and generate_content spans. Depends on the span-metrics gen_ai dimensions.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "((sum(increase({__name__=~\"gen_ai_usage_input_tokens(_total)?\"}[$__range])) or vector(0)) + (sum(increase({__name__=~\"gen_ai_usage_output_tokens(_total)?\"}[$__range])) or vector(0))) / clamp_min(sum(increase(otelcol_calls_total{gen_ai_operation_name=~\"chat|generate_content\"}[$__range])), 1)",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "id": 107,
          "type": "timeseries",
          "title": "Estimated spend rate by model ($/h)",
          "description": "Spend rate by model in $/h. Computed at query time from the gen_ai_usage_* counters x the ai:model_price_usd_per_mtok rate card (ai-cost.rules). Token samples reach Prometheus after the fact, so recording rules over them miss data. Cache tokens are carved out of input and priced at their own rates.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "drawStyle": "line",
                "fillOpacity": 18,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "((sum by (model) (clamp_min(label_replace(sum by (gen_ai_request_model, model) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") - on (model, model) (label_replace(sum by (gen_ai_request_model, model) (rate(gen_ai_usage_cache_read_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") or label_replace(sum by (gen_ai_request_model, model) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * 0) - on (model, model) (label_replace(sum by (gen_ai_request_model, model) (rate(gen_ai_usage_cache_write_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") or label_replace(sum by (gen_ai_request_model, model) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * 0), 0) * on (model) group_left () ai:model_price_usd_per_mtok{kind=\"input\"}) or (sum by (model) (label_replace(sum by (gen_ai_request_model, model) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\")) * 0)) + (sum by (model) (label_replace(sum by (gen_ai_request_model, model) (rate(gen_ai_usage_output_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * on (model) group_left () ai:model_price_usd_per_mtok{kind=\"output\"}) or (sum by (model) (label_replace(sum by (gen_ai_request_model, model) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\")) * 0)) + (sum by (model) (label_replace(sum by (gen_ai_request_model, model) (rate(gen_ai_usage_cache_read_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * on (model) group_left () ai:model_price_usd_per_mtok{kind=\"cache_read\"}) or (sum by (model) (label_replace(sum by (gen_ai_request_model, model) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\")) * 0)) + (sum by (model) (label_replace(sum by (gen_ai_request_model, model) (rate(gen_ai_usage_cache_write_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * on (model) group_left () ai:model_price_usd_per_mtok{kind=\"cache_write_5m\"}) or (sum by (model) (label_replace(sum by (gen_ai_request_model, model) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\")) * 0))) / 1e6 * 3600",
              "refId": "A",
              "legendFormat": "{{model}}"
            }
          ]
        },
        {
          "id": 108,
          "type": "timeseries",
          "title": "Token rate by kind",
          "description": "Token throughput split by kind, all models.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "drawStyle": "line",
                "fillOpacity": 18,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "input"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "output"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "cache read"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "purple"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "cache write"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "yellow"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "(sum(rate({__name__=~\"gen_ai_usage_input_tokens(_total)?\"}[$__rate_interval])) or vector(0))",
              "refId": "A",
              "legendFormat": "input"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "(sum(rate({__name__=~\"gen_ai_usage_output_tokens(_total)?\"}[$__rate_interval])) or vector(0))",
              "refId": "B",
              "legendFormat": "output"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "(sum(rate({__name__=~\"gen_ai_usage_cache_read_input_tokens(_total)?\"}[$__rate_interval])) or vector(0))",
              "refId": "C",
              "legendFormat": "cache read"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "(sum(rate({__name__=~\"gen_ai_usage_cache_write_input_tokens(_total)?\"}[$__rate_interval])) or vector(0))",
              "refId": "D",
              "legendFormat": "cache write"
            }
          ]
        },
        {
          "id": 200,
          "type": "timeseries",
          "title": "Spend by agent ($/h)",
          "description": "Spend rate by agent (span service.name) in $/h. Computed at query time from the gen_ai_usage_* counters x the ai:model_price_usd_per_mtok rate card (ai-cost.rules). Token samples reach Prometheus after the fact, so recording rules over them miss data. Cache tokens are carved out of input and priced at their own rates.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 12
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "((sum by (service_name) (clamp_min(label_replace(sum by (gen_ai_request_model, service_name) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") - on (model, service_name) (label_replace(sum by (gen_ai_request_model, service_name) (rate(gen_ai_usage_cache_read_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") or label_replace(sum by (gen_ai_request_model, service_name) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * 0) - on (model, service_name) (label_replace(sum by (gen_ai_request_model, service_name) (rate(gen_ai_usage_cache_write_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") or label_replace(sum by (gen_ai_request_model, service_name) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * 0), 0) * on (model) group_left () ai:model_price_usd_per_mtok{kind=\"input\"}) or (sum by (service_name) (label_replace(sum by (gen_ai_request_model, service_name) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\")) * 0)) + (sum by (service_name) (label_replace(sum by (gen_ai_request_model, service_name) (rate(gen_ai_usage_output_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * on (model) group_left () ai:model_price_usd_per_mtok{kind=\"output\"}) or (sum by (service_name) (label_replace(sum by (gen_ai_request_model, service_name) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\")) * 0)) + (sum by (service_name) (label_replace(sum by (gen_ai_request_model, service_name) (rate(gen_ai_usage_cache_read_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * on (model) group