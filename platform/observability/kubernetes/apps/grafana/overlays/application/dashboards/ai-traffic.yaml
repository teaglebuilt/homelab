, \"(.*)\") * on (model) group_left () ai:model_price_usd_per_mtok{kind=\"cache_read\"}) or (sum by (ai_cost_owner) (label_replace(sum by (gen_ai_request_model, ai_cost_owner) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\")) * 0)) + (sum by (ai_cost_owner) (label_replace(sum by (gen_ai_request_model, ai_cost_owner) (rate(gen_ai_usage_cache_write_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\") * on (model) group_left () ai:model_price_usd_per_mtok{kind=\"cache_write_5m\"}) or (sum by (ai_cost_owner) (label_replace(sum by (gen_ai_request_model, ai_cost_owner) (rate(gen_ai_usage_input_tokens_total[$__rate_interval])), \"model\", \"$1\", \"gen_ai_request_model\", \"(.*)\")) * 0))) / 1e6 * 3600, \"ai_cost_owner\", \"unowned\", \"ai_cost_owner\", \"\")",
