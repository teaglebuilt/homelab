# Same global Service as on application. No n8n pods run here, so Cilium
# uses the endpoints shared from the application cluster.
apiVersion: v1
kind: Service
metadata:
  name: n8n-mesh
  namespace: automation
  labels:
    app: n8n
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/shared: "true"
spec:
  type: ClusterIP
  selector:
    app: n8n
  ports:
    - name: http
      port: 5678
      targetPort: 5678
      protocol: TCP
