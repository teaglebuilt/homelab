---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: automation
  labels:
    app: n8n
    version: v1.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: n8n
        version: v1.0
    spec:
      serviceAccountName: n8n
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Always re-chmods the volume to 0660 on every start, which makes n8n
        # reject /home/node/.n8n/config. Skip once the volume root is gid 1000.
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: download-workflows
          image: public.ecr.aws/aws-cli/aws-cli:2.27.38
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              bucket="${WORKFLOWS_S3_BUCKET:?}"
              prefix="${WORKFLOWS_S3_PREFIX:-n8n/workflows}"
              src="s3://${bucket}/${prefix}/"
              echo "Syncing ${src} to /workflow-backup"
              mkdir -p /workflow-backup
              aws s3 sync "${src}" /workflow-backup/ || true
          envFrom:
            - configMapRef:
                name: n8n-config
          env:
            - name: WORKFLOWS_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: aws_homelab_remote_state_backup
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: aws_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: aws_secret_access_key
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          volumeMounts:
            - name: workflow-backup
              mountPath: /workflow-backup
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/db-health.sh"]
          envFrom:
            - configMapRef:
                name: n8n-config
          volumeMounts:
            - name: n8n-scripts
              mountPath: /scripts
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
        - name: import-workflows
          # Keep the CLI in lockstep with the runtime container (was :latest).
          image: ghcr.io/n8n-io/n8n:2.33.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/import-workflows.sh"]
          envFrom:
            - configMapRef:
                name: n8n-config
            - secretRef:
                name: n8n-secrets
          env:
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "false"
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: pg-n8n-secret
                  key: username
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-n8n-secret
                  key: password
          volumeMounts:
            - name: workflow-backup
              mountPath: /workflow-backup
              readOnly: true
            - name: n8n-scripts
              mountPath: /scripts
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        - name: fix-config-permissions
          # Runs after kubelet's fsGroup pass. n8n exits the previous process
          # when /home/node/.n8n/config is group-writable (0660).
          image: ghcr.io/n8n-io/n8n:2.33.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -f /home/node/.n8n/config ]; then
                chmod 600 /home/node/.n8n/config
              fi
          volumeMounts:
            - name: n8n-storage
              mountPath: /home/node/.n8n
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      containers:
        - name: n8n
          # 2.33.0 fixes the Postgres workflow-statistics rollup crash
          # (firstEvent.getTime is not a function) — n8n-io/n8n#34669 / PR #34670.
          image: ghcr.io/n8n-io/n8n:2.33.0
          imagePullPolicy: IfNotPresent
          # fsGroup ORs group-write onto the volume (0660) before this container
          # starts. chmod here, then hand off to the image entrypoint.
          command: ["tini", "--", "/bin/sh", "-c"]
          args:
            - |
              umask 077
              if [ -f /home/node/.n8n/config ]; then
                chmod 600 /home/node/.n8n/config
              fi
              exec /docker-entrypoint.sh
          ports:
            - containerPort: 5678
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 150m
              memory: 512Mi
            limits:
              cpu: 550m
              memory: 768Mi
          envFrom:
            - configMapRef:
                name: n8n-config
            - secretRef:
                name: n8n-secrets
          env:
            - name: N8N_MCP_MANAGED_BY_ENV
              value: "true"
            - name: N8N_MCP_ACCESS_ENABLED
              value: "true"
            - name: N8N_LOG_LEVEL
              value: "info"
            - name: N8N_METRICS
              value: "true"
            - name: N8N_SECURE_COOKIE
              value: "false"
            - name: N8N_HOST
              value: n8n.teaglebuilt.tech
            - name: N8N_EDITOR_BASE_URL
              value: https://n8n.teaglebuilt.tech
            - name: N8N_WEBHOOK_URL
              value: https://n8n.teaglebuilt.tech
            - name: N8N_MIGRATE_FS_STORAGE_PATH
              value: "true"
            - name: N8N_PROTOCOL
              value: https
            - name: N8N_PROXY_HOPS
              value: "1"
            - name: N8N_ONBOARDING_FLOW_DISABLED
              value: "true"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "false"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            - name: N8N_SKIP_AUTH_ON_OAUTH_CALLBACK
              value: "true"
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: pg-n8n-secret
                  key: username
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-n8n-secret
                  key: password
            - name: DB_POSTGRESDB_POOL_SIZE
              value: "5"
            - name: N8N_RUNNERS_TASK_TIMEOUT
              value: "300"
            - name: N8N_UNVERIFIED_PACKAGES_ENABLED
              value: "true"
            - name: N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES
              value: "2147483648"
            - name: N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES
              value: "5000"
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "false"
            - name: N8N_GIT_NODE_DISABLE_BARE_REPOS
              value: "true"
            # 2.33 reads the singular MODE var. The plural MODES var was ignored.
            - name: N8N_DEFAULT_BINARY_DATA_MODE
              value: s3
            - name: N8N_EXTERNAL_STORAGE_S3_HOST
              value: "s3.us-east-1.amazonaws.com"
            - name: N8N_EXTERNAL_STORAGE_S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: WORKFLOWS_BUCKET_NAME
            - name: N8N_EXTERNAL_STORAGE_S3_BUCKET_REGION
              value: "us-east-1"
            - name: N8N_EXTERNAL_STORAGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: aws_access_key_id
            - name: N8N_EXTERNAL_STORAGE_S3_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: aws-credentials
                  key: aws_secret_access_key
          volumeMounts:
            - name: n8n-storage
              mountPath: /home/node/.n8n
            - name: shared-data
              mountPath: /data/shared
      volumes:
        - name: n8n-storage
          persistentVolumeClaim:
            claimName: n8n-storage-pvc
        - name: shared-data
          emptyDir: {}
        - name: workflow-backup
          emptyDir: {}
        - name: n8n-scripts
          configMap:
            name: n8n-scripts
