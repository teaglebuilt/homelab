# Cilium ClusterMesh front door. n8n runs on application; the MCP token
# minter on mlops dials this ClusterIP and Cilium routes cross-cluster.
apiVersion: v1
kind: Service
metadata:
  name: n8n-mesh
  namespace: automation
  labels:
    app: n8n
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/shared: "true"
spec:
  type: ClusterIP
  selector:
    app: n8n
  ports:
    - name: http
      port: 5678
      targetPort: 5678
      protocol: TCP
