---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: jev-routing}
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: jev-routing
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces: {from: Same}
