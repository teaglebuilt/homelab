---
version: 3

tasks:
  install:
    cmds:
      - curl https://raw.githubusercontent.com/kagent-dev/kagent/refs/heads/main/scripts/get-kagent | bash -s -- --version v1.0.0-alpha16

  debug-agent:
    desc: |
      Print Agent conditions and substrate worker + controller logs.
      Usage: task platform:ai:debug-agent AGENT=solutions-architect
    requires:
      vars: [AGENT]
    vars:
      CLUSTER: '{{.CLUSTER | default "mlops"}}'
      KUBECONFIG_FILE: '{{.ROOT_DIR}}/kubernetes/generated/{{.CLUSTER}}/kubeconfig'
      AI_NAMESPACE: '{{.AI_NAMESPACE | default "ai"}}'
      TAIL: '{{.TAIL | default "200"}}'
    preconditions:
      - sh: test -f '{{.KUBECONFIG_FILE}}'
        msg: "kubeconfig not found: {{.KUBECONFIG_FILE}}"
    cmds:
      - |
        KUBECONFIG_FILE='{{.KUBECONFIG_FILE}}' \
        AGENT='{{.AGENT}}' \
        AI_NAMESPACE='{{.AI_NAMESPACE}}' \
        TAIL='{{.TAIL}}' \
        '{{.TASKFILE_DIR}}/debug-agent.sh'
