apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: sre-team-egress-policies
  namespace: ai
spec:
  destinations:
    - origin: http://kagent-tools.ai.svc.cluster.local
    - origin: http://kagent-tools.ai
    - origin: http://kagent-grafana-mcp.ai.svc.cluster.local:8000
      authentication:
        header: Authorization
        secretKeyRef:
          name: kagent-grafana-mcp-auth
          key: MCP_GRAFANA_AUTHORIZATION
