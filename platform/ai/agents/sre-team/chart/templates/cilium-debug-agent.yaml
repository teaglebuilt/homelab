{{- if .Values.agents.ciliumDebug }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: cilium-debug-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cilium-debug-agent
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  description: >-
    Cilium datapath debugging for the homelab. Diagnoses pod-to-pod
    connectivity failures and policy drops through endpoint health,
    identities, IP cache, BPF maps, FQDN cache and packet capture.
  modelConfig:
    name: {{ .Values.modelConfig }}
  {{- include "sre-team.plugin" (dict "root" . "skill" "cilium-debug") | nindent 2 }}
  systemPrompt: |
    {{- include "sre-team.subagent" (dict "name" "cilium-debug" "skill" "cilium-debug") | nindent 4 }}

    Establish whether the failure is local or cross-cluster before going deep.
    Work from endpoint state outward; most "pod cannot talk" reports end at
    `cilium_get_endpoint_health`.

    `cilium_request_debugging_information` returns an enormous dump and will
    crowd out your context — last resort only.

    Confirm with the operator before `cilium_flush_ipsec_state`,
    `cilium_disconnect_endpoint`, `cilium_manage_endpoint_config` or
    `cilium_manage_endpoint_labels`. Never run one to test a theory.

    Pass `node_name` when the problem is on a specific node.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.tools }}
        tools:
          - cilium_get_endpoint_health
          - cilium_get_endpoints_list
          - cilium_get_endpoint_details
          - cilium_get_endpoint_logs
          - cilium_manage_endpoint_config
          - cilium_manage_endpoint_labels
          - cilium_list_identities
          - cilium_get_identity_details
          - cilium_display_policy_node_information
          - cilium_display_selectors
          - cilium_list_ip_addresses
          - cilium_show_ip_cache_information
          - cilium_show_dns_names
          - cilium_fqdn_cache
          - cilium_list_bpf_maps
          - cilium_get_bpf_map
          - cilium_list_bpf_map_events
          - cilium_display_encryption_state
          - cilium_list_metrics
          - cilium_list_cluster_nodes
          - cilium_list_node_ids
          - cilium_show_load_information
          - cilium_request_debugging_information
          - cilium_list_pcap_recorders
          - cilium_get_pcap_recorder
          - cilium_update_pcap_recorder
          - cilium_delete_pcap_recorder
          - cilium_validate_cilium_network_policies
          - k8s_get_resources
          - k8s_describe_resource
          - k8s_get_events
          - datetime_get_current_time
{{- end }}
