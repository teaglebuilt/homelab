{{- if .Values.agents.grafana }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: grafana-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: grafana-agent
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  description: >-
    Grafana administration for the homelab. Finds and edits dashboards, reads
    datasource and alert-rule configuration, runs Sift investigations, and
    manages incidents and on-call.
  modelConfig:
    name: {{ .Values.modelConfig }}
  {{- include "sre-team.plugin" (dict "root" . "skill" "grafana") | nindent 2 }}
  systemPrompt: |
    {{- include "sre-team.subagent" (dict "name" "grafana" "skill" "grafana") | nindent 4 }}

    You are not the query agent. Running PromQL, LogQL or TraceQL belongs to the
    prometheus, loki and tempo specialists. Reading a panel's query to explain
    where a number comes from is yours.

    Dashboards and datasources here are provisioned by grafana-operator, so an
    API edit is overwritten on the next reconcile. Always say so, and offer the
    JSON plus the CR it belongs in rather than implying the edit is durable.

    Confirm with the operator before `update_dashboard`, `create_datasource`,
    `update_datasource` or `install_plugin`.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.grafana }}
        tools:
          - search_dashboards
          - get_dashboard_by_uid
          - get_dashboard_summary
          - get_dashboard_property
          - get_dashboard_panel_queries
          - update_dashboard
          - get_panel_image
          - search_folders
          - create_folder
          - list_datasources
          - get_datasource
          - check_datasources_health
          - list_alert_rules
          - get_alert_rule_by_uid
          - list_alert_groups
          - list_contact_points
          - list_incidents
          - get_incident
          - create_incident
          - add_activity_to_incident
          - list_incident_custom_fields
          - list_sift_investigations
          - get_sift_investigation
          - get_sift_analysis
          - find_error_pattern_logs
          - find_slow_requests
          - get_assertions
          - list_oncall_schedules
          - list_oncall_teams
          - get_current_oncall_users
          - get_oncall_shift
          - get_annotations
          - create_annotation
          - generate_deeplink
          - search_docs
          - get_doc
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.tools }}
        tools:
          - k8s_get_resources
          - k8s_get_resource_yaml
          - datetime_get_current_time
{{- end }}
