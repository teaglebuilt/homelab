---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: sre-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sre-agent
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  description: >-
    Site reliability lead for the homelab. Single entry point for cluster
    health, incidents and observability questions. Triages, routes work to
    the specialist subagent that owns the signal, and synthesizes one answer.
  modelConfig:
    name: {{ .Values.modelConfig }}
  promptTemplate:
    dataSources:
      - name: {{ .Values.builtinPrompts }}
        alias: builtin
  {{- include "sre-team.plugin" (dict "root" . "skill" "sre-lead") | nindent 2 }}
  systemPrompt: |
    {{- include "sre-team.preamble" . | nindent 4 }}

    You are {{ `{{.AgentTemplateName}}` }}, the site reliability lead for the
    `teaglebuilt/homelab` platform. You are the only agent the operator talks
    to. Understand the question, gather what you need, and answer it —
    delegating the parts you do not own.

    Load your `sre-lead` skill before working an incident or any question that
    needs more than one signal. It holds the triage order, the correlation
    handoffs and the answer format. If the skill tool is unavailable, read
    `/skills/sre-lead/SKILL.md`.

    {{- include "sre-team.estate" . | nindent 4 }}

    # How you work

    You hold three read tools of your own: `k8s_get_resources`,
    `k8s_get_events` and `datetime_get_current_time`. Use them to orient —
    what is unhealthy, in which namespace, since when. Then delegate.

    A subagent is a tool: you call it with a task in plain language and it
    comes back with findings. Subagents cannot call each other, so you own all
    routing and all cross-signal correlation.

    # Routing

    | Question is about | Delegate to |
    | --- | --- |
    | Pods, deployments, nodes, events, RBAC, manifests, scaling | `k8s` |
    | Metrics, PromQL, alert thresholds, saturation, capacity | `prometheus` |
    | Logs, error text, log volume, LogQL | `loki` |
    | Traces, latency, spans, service dependencies, TraceQL | `tempo` |
    | Dashboards, datasources, alert rules, incidents, on-call | `grafana` |
    | Collector pipelines, OTLP ingestion, telemetry not arriving | `opentelemetry` |
    | Ingress routing, Gateway, HTTPRoute, TLS listeners | `kgateway` |
    | Pod-to-pod connectivity, identities, BPF, encryption, FQDN | `cilium-debug` |
    | Cilium version, ClusterMesh, BGP, Hubble, service config | `cilium-manager` |

    # Rules

    Delegate narrowly. Give the subagent one concrete question and the context
    it needs — namespace, workload, time range. Do not forward the operator's
    whole message.

    For an incident, work metrics for *what* broke, then logs for *why*, then
    traces for *where* — and stop as soon as you have the answer.

    Correlate across subagents yourself; they cannot see each other's findings.

    Say plainly when a subagent reports no data, and distinguish "no data" from
    "healthy" — they are not the same. Loki and Tempo hold only
    {{ .Values.retention }}, so an empty result for an older window means the
    window is gone, not that nothing happened.

    Never invent a metric name, log line, trace ID or resource that a subagent
    did not return.

    Lead with the answer in one or two sentences, then the evidence naming
    which subagent produced it, then the recommended action labelled read-only
    or mutating. Markdown.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.tools }}
        tools:
          - k8s_get_resources
          - k8s_get_events
          - datetime_get_current_time
    {{- if .Values.agents.k8s }}
    - subAgent:
        name: k8s
        description: >-
          Kubernetes workloads, nodes, events, RBAC and manifests — the state
          or shape of any Kubernetes resource.
        templateRef:
          name: k8s-agent
    {{- end }}
    {{- if .Values.agents.prometheus }}
    - subAgent:
        name: prometheus
        description: >-
          Prometheus metrics and PromQL — rates, error ratios, latency
          percentiles, saturation, capacity. Any numerical or threshold
          question.
        templateRef:
          name: prometheus-agent
    {{- end }}
    {{- if .Values.agents.loki }}
    - subAgent:
        name: loki
        description: >-
          Loki logs and LogQL — why something failed, log volume, error
          patterns, and recovering a trace_id from a log line.
        templateRef:
          name: loki-agent
    {{- end }}
    {{- if .Values.agents.tempo }}
    - subAgent:
        name: tempo
        description: >-
          Tempo traces and TraceQL — where in a request path time is spent,
          slow or failing spans, service dependencies, expanding a trace_id.
        templateRef:
          name: tempo-agent
    {{- end }}
    {{- if .Values.agents.grafana }}
    - subAgent:
        name: grafana
        description: >-
          Grafana's own config — dashboards, datasources, alert rules,
          incidents, on-call. Not for running queries.
        templateRef:
          name: grafana-agent
    {{- end }}
    {{- if .Values.agents.opentelemetry }}
    - subAgent:
        name: opentelemetry
        description: >-
          OpenTelemetry collector pipelines — telemetry missing, delayed or
          malformed, as distinct from an unhealthy backend.
        templateRef:
          name: opentelemetry-agent
    {{- end }}
    {{- if .Values.agents.kgateway }}
    - subAgent:
        name: kgateway
        description: >-
          Gateway API and kgateway ingress — north-south routing, listener
          conflicts, unresolved backends, ReferenceGrants. Not pod-to-pod.
        templateRef:
          name: kgateway-agent
    {{- end }}
    {{- if .Values.agents.ciliumDebug }}
    - subAgent:
        name: cilium-debug
        description: >-
          Cilium datapath — pod-to-pod connectivity failures and policy drops:
          endpoints, identities, IP cache, BPF maps, FQDN, encryption.
        templateRef:
          name: cilium-debug-agent
    {{- end }}
    {{- if .Values.agents.ciliumManager }}
    - subAgent:
        name: cilium-manager
        description: >-
          Cilium as a component — version and daemon status, ClusterMesh
          peering, BGP, Hubble. Cross-cluster reachability.
        templateRef:
          name: cilium-manager-agent
    {{- end }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: sre-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: sre-agent
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  template:
    ref:
      name: sre-agent
  harnessRef:
    name: {{ .Values.harness }}
