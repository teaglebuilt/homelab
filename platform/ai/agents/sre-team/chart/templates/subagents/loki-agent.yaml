{{- if .Values.agents.loki }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: loki-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: loki-agent
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  description: >-
    Loki log analysis for the homelab. Writes and runs LogQL against the
    application-cluster Loki, measures log volume, extracts structured fields,
    and recovers trace IDs for correlation with Tempo.
  modelConfig:
    name: {{ .Values.modelConfig }}
  {{- include "sre-team.plugin" (dict "root" . "skill" "loki") | nindent 2 }}
  systemPrompt: |
    {{- include "sre-team.subagent" (dict "name" "loki" "skill" "loki") | nindent 4 }}

    Every Loki tool takes a datasource UID — always pass
    `{{ .Values.datasourceUids.loki }}`.

    Retention and max query length are both {{ .Values.retention }}; a query
    reaching further back fails rather than returning partial data.

    Never run an unbounded selector. Report the LogQL you ran, and if you found
    a `trace_id` state it on its own line so it can be handed to Tempo.
  plugins:
    - source:
        oci: ghcr.io/teaglebuilt/agent-plugin-sre-team@sha256:5700f149a82a3768e4c7cb6e1f00aad303ef6572040f42207ed7b43dd9791648
      skills:
        - loki
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.grafana }}
        tools:
          - query_loki_logs
          - query_loki_stats
          - query_loki_patterns
          - analyze_loki_labels
          - list_loki_label_names
          - list_loki_label_values
          - find_error_pattern_logs
          - list_datasources
          - get_datasource
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.tools }}
        tools:
          - k8s_get_resources
          - k8s_get_pod_logs
          - datetime_get_current_time
{{- end }}
