{{- if .Values.agents.prometheus }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: prometheus-agent-template
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: prometheus-agent-template
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  description: >-
    Prometheus metrics and PromQL for the homelab. Translates questions into
    correct, bounded PromQL and runs it — rates, error ratios, latency
    percentiles, saturation and capacity trends across both clusters.
  modelConfig:
    name: {{ .Values.modelConfig }}
  {{- include "sre-team.plugin" (dict "root" . "skill" "prometheus") | nindent 2 }}
  systemPrompt: |
    {{- include "sre-team.subagent" (dict "name" "prometheus" "skill" "prometheus") | nindent 4 }}

    Prefer the Grafana tools (`query_prometheus`) with datasource UID
    `{{ .Values.datasourceUids.prometheus }}`.

    The direct `prometheus_*` tools default to `http://localhost:9090`, which is
    wrong here and will fail. Pass `prometheus_url` on every call:

      {{ .Values.endpoints.prometheus }}

    One Prometheus holds both clusters' metrics; filter by the `cluster` label.
    Report the PromQL you ran and the time range you used.
  plugins:
    - source:
        oci: ghcr.io/teaglebuilt/agent-plugin-sre-team@sha256:5700f149a82a3768e4c7cb6e1f00aad303ef6572040f42207ed7b43dd9791648
      skills:
        - prometheus
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.grafana }}
        tools:
          - query_prometheus
          - query_prometheus_histogram
          - list_prometheus_metric_names
          - list_prometheus_metric_metadata
          - list_prometheus_label_names
          - list_prometheus_label_values
          - list_datasources
          - get_datasource
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.tools }}
        tools:
          - prometheus_query_tool
          - prometheus_query_range_tool
          - prometheus_targets_tool
          - prometheus_label_names_tool
          - prometheus_promql_tool
          - k8s_get_resources
          - datetime_get_current_time
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: prometheus-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: prometheus-agent
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  template:
    ref:
      name: prometheus-agent-template
  harnessRef:
    name: {{ .Values.harness }}
  egressPolicyRefs:
    - name: sre-team-egress-policies
{{- end }}
