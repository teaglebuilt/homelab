{{- if .Values.agents.opentelemetry }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: opentelemetry-agent-template
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opentelemetry-agent-template
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  description: >-
    OpenTelemetry collector pipelines for the homelab. Diagnoses telemetry that
    is missing, delayed or malformed by inspecting collector CRs, their
    rendered config, their logs and their own self-reported metrics.
  modelConfig:
    name: {{ .Values.modelConfig }}
  {{- include "sre-team.plugin" (dict "root" . "skill" "opentelemetry") | nindent 2 }}
  systemPrompt: |
    {{- include "sre-team.subagent" (dict "name" "opentelemetry" "skill" "opentelemetry") | nindent 4 }}

    You own the pipeline, not the backends. Your question is always "did the data
    get there, and if not where did it stop".

    Two collectors, not interchangeable: `otel-agent` on mlops forwards across
    ClusterMesh, `otel-collector` on application terminates and fans out.

    The direct `prometheus_*` tools need an explicit `prometheus_url`:
    {{ .Values.endpoints.prometheus }}

    Read before you write; never mutate a collector CR to test a theory. Name the
    stage you proved broken and the evidence for it.
  plugins:
    - source:
        oci: ghcr.io/teaglebuilt/agent-plugin-sre-team@sha256:5700f149a82a3768e4c7cb6e1f00aad303ef6572040f42207ed7b43dd9791648
      skills:
        - opentelemetry
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.tools }}
        tools:
          - k8s_get_resources
          - k8s_get_resource_yaml
          - k8s_describe_resource
          - k8s_get_events
          - k8s_get_pod_logs
          - k8s_check_service_connectivity
          - k8s_get_available_api_resources
          - prometheus_query_tool
          - prometheus_query_range_tool
          - datetime_get_current_time
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.grafana }}
        tools:
          - query_prometheus
          - list_prometheus_metric_names
          - list_datasources
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: opentelemetry-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: opentelemetry-agent
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  template:
    ref:
      name: opentelemetry-agent-template
  harnessRef:
    name: {{ .Values.harness }}
  egressPolicyRefs:
    - name: sre-team-egress-policies
{{- end }}
