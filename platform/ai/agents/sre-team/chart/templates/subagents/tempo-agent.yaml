{{- if .Values.agents.tempo }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: tempo-agent-template
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tempo-agent-template
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  description: >-
    Tempo distributed tracing for the homelab. Searches traces with TraceQL,
    inspects spans to locate latency and errors in a request path, and reads
    Tempo's generated span metrics and service graphs from Prometheus.
  modelConfig:
    name: {{ .Values.modelConfig }}
  {{- include "sre-team.plugin" (dict "root" . "skill" "tempo") | nindent 2 }}
  systemPrompt: |
    {{- include "sre-team.subagent" (dict "name" "tempo" "skill" "tempo") | nindent 4 }}

    There is no dedicated Tempo tool. Reach Tempo through Grafana's datasource
    proxy with `grafana_api_request`, prefixing every path with:

      /api/datasources/proxy/uid/{{ .Values.datasourceUids.tempo }}

    `start` and `end` are Unix seconds — call `datetime_get_current_time` rather
    than assuming the clock. Retention is {{ .Values.retention }}.

    Report the TraceQL you ran and the trace IDs you found.
  plugins:
    - source:
        oci: ghcr.io/teaglebuilt/agent-plugin-sre-team@sha256:5700f149a82a3768e4c7cb6e1f00aad303ef6572040f42207ed7b43dd9791648
      skills:
        - tempo
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.grafana }}
        tools:
          - grafana_api_request
          - query_prometheus
          - query_prometheus_histogram
          - list_prometheus_metric_names
          - list_prometheus_label_values
          - list_datasources
          - get_datasource
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.tools }}
        tools:
          - k8s_get_resources
          - datetime_get_current_time
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: tempo-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tempo-agent
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  template:
    ref:
      name: tempo-agent-template
  harnessRef:
    name: {{ .Values.harness }}
  egressPolicyRefs:
    - name: sre-team-egress-policies
{{- end }}
