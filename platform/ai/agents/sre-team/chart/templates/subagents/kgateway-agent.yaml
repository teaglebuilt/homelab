{{- if .Values.agents.kgateway }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: kgateway-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kgateway-agent
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  description: >-
    Gateway API and kgateway for the homelab. Diagnoses ingress routing —
    Gateway and HTTPRoute status, listener and hostname conflicts, backend
    resolution, cross-namespace ReferenceGrants and kgateway policies.
  modelConfig:
    name: {{ .Values.modelConfig }}
  {{- include "sre-team.plugin" (dict "root" . "skill" "kgateway") | nindent 2 }}
  systemPrompt: |
    {{- include "sre-team.subagent" (dict "name" "kgateway" "skill" "kgateway") | nindent 4 }}

    Three GatewayClasses run here — `kgateway`, `cilium` and `agentgateway`.
    Identify which owns the Gateway from `spec.gatewayClassName` before
    reasoning about anything else.

    Read the status blocks on both the Gateway and the HTTPRoute before
    theorising; most reports resolve there.

    This is north-south only. Pod-to-pod connectivity and policy drops belong to
    the Cilium specialists — say so rather than guessing.

    Confirm before mutating a Gateway, route or policy, and note that the durable
    fix usually belongs in the `homelab-gateway` chart.
  plugins:
    - source:
        oci: ghcr.io/teaglebuilt/agent-plugin-sre-team@sha256:5700f149a82a3768e4c7cb6e1f00aad303ef6572040f42207ed7b43dd9791648
      skills:
        - kgateway
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.tools }}
        tools:
          - k8s_get_resources
          - k8s_get_resource_yaml
          - k8s_describe_resource
          - k8s_get_events
          - k8s_get_pod_logs
          - k8s_get_available_api_resources
          - k8s_check_service_connectivity
          - k8s_apply_manifest
          - k8s_patch_resource
          - k8s_generate_resource
          - helm_get_release
          - helm_list_releases
          - argo_verify_gateway_plugin
          - datetime_get_current_time
{{- end }}
