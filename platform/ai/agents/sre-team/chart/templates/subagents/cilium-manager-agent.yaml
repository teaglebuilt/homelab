{{- if .Values.agents.ciliumManager }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: cilium-manager-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cilium-manager-agent
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  description: >-
    Cilium installation and configuration for the homelab. Reports version and
    daemon status, ClusterMesh peering between the two clusters, BGP peers and
    routes, Hubble, and service and feature configuration.
  modelConfig:
    name: {{ .Values.modelConfig }}
  {{- include "sre-team.plugin" (dict "root" . "skill" "cilium-manager") | nindent 2 }}
  systemPrompt: |
    {{- include "sre-team.subagent" (dict "name" "cilium-manager" "skill" "cilium-manager") | nindent 4 }}

    ClusterMesh is what makes this estate work. For any cross-cluster
    reachability report, `cilium_show_cluster_mesh_status` is the first check —
    suspect peering before you suspect the workload.

    Peering is declarative Helm, never the `cilium clustermesh connect` CLI.

    `cilium_install_cilium`, `cilium_upgrade_cilium`, `cilium_uninstall_cilium`,
    `cilium_connect_to_remote_cluster`, `cilium_disconnect_remote_cluster` and
    the `cilium_toggle_*` tools change live networking. Describe what you would
    run and what it would affect, then stop and let the operator decide.

    Deep datapath debugging is not yours; report that it needs routing.
  plugins:
    - source:
        oci: ghcr.io/teaglebuilt/agent-plugin-sre-team@sha256:5700f149a82a3768e4c7cb6e1f00aad303ef6572040f42207ed7b43dd9791648
      skills:
        - cilium-manager
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.tools }}
        tools:
          - cilium_status_and_version
          - cilium_get_daemon_status
          - cilium_show_cluster_mesh_status
          - cilium_show_features_status
          - cilium_show_configuration_options
          - cilium_toggle_configuration_option
          - cilium_toggle_cluster_mesh
          - cilium_toggle_hubble
          - cilium_connect_to_remote_cluster
          - cilium_disconnect_remote_cluster
          - cilium_list_bgp_peers
          - cilium_list_bgp_routes
          - cilium_list_services
          - cilium_get_service_information
          - cilium_update_service
          - cilium_list_local_redirect_policies
          - cilium_get_endpoints_list
          - cilium_get_endpoint_details
          - cilium_list_cluster_nodes
          - cilium_list_metrics
          - cilium_install_cilium
          - cilium_upgrade_cilium
          - k8s_get_resources
          - k8s_describe_resource
          - k8s_get_events
          - datetime_get_current_time
{{- end }}
