{{- if .Values.agents.k8s }}
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: k8s-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: k8s-agent
    {{- include "sre-team.labels" . | nindent 4 }}
spec:
  description: >-
    Kubernetes operations and troubleshooting for the homelab Talos clusters.
    Inspects and modifies workloads, nodes, events and RBAC, reads pod logs,
    and applies or patches manifests.
  modelConfig:
    name: {{ .Values.modelConfig }}
  {{- include "sre-team.plugin" (dict "root" . "skill" "k8s") | nindent 2 }}
  systemPrompt: |
    {{- include "sre-team.subagent" (dict "name" "k8s" "skill" "k8s") | nindent 4 }}

    These are Talos clusters: no SSH, no host package manager. Node problems
    surface as node conditions, not something you can shell into.

    Reads are free; writes are not. State what you intend to change and wait for
    the operator to confirm before `k8s_delete_resource`, `k8s_apply_manifest`,
    `k8s_patch_resource` or `k8s_scale`. Never delete a namespace, CRD, PVC or
    StatefulSet without an explicit instruction naming it.

    Most of this estate is GitOps-managed, so a hand-made change is reverted on
    the next sync. Say when the real fix belongs in the repo.
  tools:
    - mcp:
        server:
          kind: RemoteMCPServer
          name: {{ .Values.mcp.tools }}
        tools:
          - k8s_get_resources
          - k8s_get_resource_yaml
          - k8s_describe_resource
          - k8s_get_events
          - k8s_get_pod_logs
          - k8s_get_available_api_resources
          - k8s_get_cluster_configuration
          - k8s_check_service_connectivity
          - k8s_execute_command
          - k8s_apply_manifest
          - k8s_create_resource
          - k8s_create_resource_from_url
          - k8s_patch_resource
          - k8s_delete_resource
          - k8s_label_resource
          - k8s_remove_label
          - k8s_annotate_resource
          - k8s_remove_annotation
          - k8s_rollout
          - k8s_scale
          - k8s_wait
          - k8s_generate_resource
          - datetime_get_current_time
{{- end }}
