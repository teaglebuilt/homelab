---
apiVersion: api.kagent.dev/v1alpha3
kind: EgressPolicy
metadata:
  name: solutions-architect-agent-github
  namespace: {{ .Release.Namespace }}
spec:
  destinations:
    # External
    - origin: https://github.com
    - origin: https://api.github.com
    - origin: https://api.githubcopilot.com
    # Cluster MCP (short + FQDN; inferred policy alone is not reaching actors)
    - origin: http://kagent-tools.ai:8084
    - origin: http://kagent-tools.ai.svc.cluster.local:8084
    - origin: http://kb-retrieval.ai.svc.cluster.local:3000
    - origin: http://firecrawl-mcp.automation.svc.cluster.local:3000
    # documentation subAgent runs in this Agent's sandbox, so its
    # destinations must be granted here (mirrors knowledge-tree docsAgent.egressOrigins)
    - origin: http://kb-ingest.ai.svc.cluster.local:3000
    - origin: https://mcp.context7.com
    # Model endpoint used by llmd-vllm-config
    - origin: http://vllm-selfhosted.ai.svc.cluster.local:8000
