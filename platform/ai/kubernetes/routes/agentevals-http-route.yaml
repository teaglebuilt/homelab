---
# Dedicated hostname — agentevals SPA serves absolute /assets/* from root,
# so a /evals path prefix on ai.homelab.internal cannot work without a basePath.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentevals-http-route
  namespace: ai
  annotations:
    external-dns.alpha.kubernetes.io/hostname: evals.homelab.internal,evals.teaglebuilt.tech
spec:
  parentRefs:
    - name: homelab-internal-gateway
      namespace: kube-system
  hostnames:
    - evals.homelab.internal
    - evals.teaglebuilt.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: agentevals
          kind: Service
          port: 8001
