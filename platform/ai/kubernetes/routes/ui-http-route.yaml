---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kgateway-http-route
  namespace: ai
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ai.homelab.internal,ai.teaglebuilt.tech
spec:
  parentRefs:
  - name: homelab-internal-gateway
    namespace: kube-system
  hostnames:
  - "ai.homelab.internal"
  - "ai.teaglebuilt.tech"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - name: kagent-controller-h2c
      kind: Service
      port: 8083
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kagent-ui
      kind: Service
      port: 8080
