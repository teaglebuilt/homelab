---
# Vendored from the grafana-mcp subchart that kagent dropped in 1.0.x
# (kagent-dev/kagent#3294). Names match the subchart's, because
# agents/sre-team binds this RemoteMCPServer and Service by name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagent-grafana-mcp
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: kagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kagent-grafana-mcp
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: kagent
data:
  GRAFANA_URL: http://grafana-mesh.observability.svc.cluster.local
  GRAFANA_ORG_ID: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: kagent-grafana-mcp
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: kagent
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: kagent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kagent-grafana-mcp
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: kagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
      app.kubernetes.io/instance: kagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-mcp
        app.kubernetes.io/instance: kagent
    spec:
      serviceAccountName: kagent-grafana-mcp
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana-mcp
          image: docker.io/grafana/mcp-grafana:1.4.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsGroup: 999
            runAsUser: 1000
          args:
            - --transport
            - streamable-http
            - -allowed-hosts
            - "*"
          envFrom:
            - configMapRef:
                name: kagent-grafana-mcp
            - secretRef:
                name: kagent-grafana-mcp-auth
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: kagent-grafana-mcp
  labels:
    app.kubernetes.io/name: grafana-mcp
    app.kubernetes.io/instance: kagent
spec:
  description: Grafana MCP server
  protocol: STREAMABLE_HTTP
  # FQDN: substrate sandboxes resolve only fully qualified names, and this is
  # the origin agents/sre-team grants egress to.
  url: http://kagent-grafana-mcp.ai.svc.cluster.local:8000/mcp
  sseReadTimeout: 5m0s
  terminateOnClose: true
  timeout: 30s
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: kagent-grafana-mcp-auth
        key: MCP_GRAFANA_AUTHORIZATION
