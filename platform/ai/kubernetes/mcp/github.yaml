---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: github-mcp
  namespace: ai
spec:
  description: "GitHub MCP (Copilot remote): repos, issues, PRs, code search"
  protocol: STREAMABLE_HTTP
  url: https://api.githubcopilot.com/mcp/
  timeout: 120s
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: mcp-secrets
        key: GITHUB_PERSONAL_ACCESS_TOKEN
