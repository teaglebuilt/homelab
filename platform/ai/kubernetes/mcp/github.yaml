---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: github-mcp-server
  namespace: ai
  labels:
    app: github-mcp-server
spec:
  deployment:
    args:
    - 'stdio'
    cmd: "/server/github-mcp-server"
    image: ghcr.io/github/github-mcp-server
    port: 3000
    # Inject GITHUB_PERSONAL_ACCESS_TOKEN (and sibling keys) via envFrom —
    # do not copy the token into this CR.
    secretRefs:
      - name: mcp-secrets
  transportType: stdio
