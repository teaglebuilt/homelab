---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: firecrawl
  namespace: ai
spec:
  description: "Firecrawl MCP (self-hosted): scrape, crawl, map, search, extract"
  protocol: STREAMABLE_HTTP
  url: http://firecrawl-mcp.automation.svc.cluster.local:3000/mcp
  timeout: 120s
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: firecrawl-mcp-backend
  namespace: ai
spec:
  mcp:
    targets:
      - name: firecrawl
        static:
          host: firecrawl-mcp.automation.svc.cluster.local
          port: 3000
          path: /mcp
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-firecrawl-route
  namespace: ai
spec:
  parentRefs:
  - name: ai-gateway
    namespace: ai
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /mcp/firecrawl
    backendRefs:
    - name: mcp-backend
      group: agentgateway.dev
      kind: AgentgatewayBackend
