# CronJob n8n-mcp-token on mlops writes ai/n8n-mcp-token with this account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-mcp-token-writer
  namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: n8n-mcp-token
  namespace: ai
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["n8n-mcp-token"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: n8n-mcp-token
  namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: n8n-mcp-token
subjects:
  - kind: ServiceAccount
    name: n8n-mcp-token-writer
    namespace: ai
