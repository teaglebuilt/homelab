# MCP front of platform/ai/apps/youtube-transcript. Tools are generated from
# the service's FastAPI routes (FastMCP.from_fastapi); tool name = operation_id:
#   get_timed_transcript     every caption segment {text,start,duration} + metadata
#   get_video_info           title / uploader / upload_date / duration
#   get_transcript_markdown  full knowledge-tree note, not stored
#   ingest_video             WRITES the note to Qdrant via kb-ingest
# Agents bind only the tools they list; keep ingest_video off read-only agents.
# Captions only — no ASR fallback; captions_source is always "unknown".
---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: youtube-transcript
  namespace: ai
spec:
  description: >-
    YouTube captions + metadata, and full-transcript ingestion into the
    knowledge base. Captions only; videos without captions return
    available=false.
  protocol: STREAMABLE_HTTP
  url: http://youtube-transcript.ai.svc.cluster.local:3000/mcp
  timeout: 360s
