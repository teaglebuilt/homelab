---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memory-server-data
  namespace: ai
  labels:
    app.kubernetes.io/name: memory-server
    app.kubernetes.io/part-of: homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: memory-server
  namespace: ai
spec:
  deployment:
    args:
      - "-y"
      - "@modelcontextprotocol/server-memory@1.0.0"
    cmd: npx
    image: node:24-alpine3.21
    port: 3000
    env:
      MEMORY_FILE_PATH: /data/memory.jsonl
    volumeMounts:
      - name: data
        mountPath: /data
    volumes:
      - name: data
        persistentVolumeClaim:
          claimName: memory-server-data
  transportType: stdio
