---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-federated-route
  namespace: ai
spec:
  parentRefs:
  - name: ai-gateway
    namespace: ai
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /mcp/federated
    backendRefs:
    - name: mcp-backend
      group: agentgateway.dev
      kind: AgentgatewayBackend
