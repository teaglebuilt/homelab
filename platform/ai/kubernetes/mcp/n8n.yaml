---
apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: n8n
  namespace: ai
spec:
  description: "n8n instance-level MCP (self-hosted): node discovery, workflow SDK, validate, create/update workflows"
  protocol: STREAMABLE_HTTP
  # Proxy rewrites tools/call arguments:null to {}. n8n rejects null.
  url: http://n8n-mcp-proxy.ai.svc.cluster.local:8080/mcp-server/http
  timeout: 120s
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: n8n-mcp-token
        key: token
