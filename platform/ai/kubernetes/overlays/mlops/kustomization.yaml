---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../aigateway
  - ../../llm-providers
  - ../../harness
  - ../../agents
  - ../../routes
  - ../../substrate
  - ../../database
  - ../../mcp
  - ../../apps/youtube-transcript
  # Bearer shared with application (youtube-transcript, kb-mcp-write -> kb-api over mesh).
  - ../../apps/kb-api
  - ../../apps/kb-api/mesh
helmCharts:
  - name: agentgateway
    repo: oci://ghcr.io/kgateway-dev/charts
    releaseName: agentgateway
    version: v2.2.1
    namespace: ai
  - name: kmcp-crds
    repo: oci://ghcr.io/kagent-dev/kmcp/helm
    releaseName: kmcp-crds
    version: 0.4.0
    namespace: ai
  - name: kmcp
    repo: oci://ghcr.io/kagent-dev/kmcp/helm
    releaseName: kmcp
    version: 0.4.0
    namespace: ai
  - name: kagent
    repo: oci://ghcr.io/kagent-dev/kagent/helm
    releaseName: kagent
    version: 1.0.0-alpha16
    namespace: ai
    valuesInline:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      config:
        database:
          vectorEnabled: true
        telemetry:
          traces:
            endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
            protocol: grpc
            timeout: 15s
          logs:
            endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
            protocol: grpc
            timeout: 15s
        runtimeDefaults:
          telemetry:
            # Required for agentevals trajectory/text graders (user input + replies).
            # Tool args/results are already on execute_tool spans when tracing is on.
            # Restrict evals.homelab.internal / OTLP retention — content may include prompts.
            captureContent: true
            traces:
              endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
              protocol: grpc
              timeout: 15s
            logs:
              endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
              protocol: grpc
              timeout: 15s
      providers:
        default: openAI
        openAI:
          provider: OpenAI
          model: "gpt-4o-mini"
          apiKeySecretRef: openai-api-key-secret
          apiKeySecretKey: Authorization
        ollama:
          provider: Ollama
          model: "llama3.2"
          config:
            host: ollama.ai.svc.cluster.local:11434
      controller:
        # Mounts the podidentity credential + servicedns CA so the controller can
        # authenticate to the substrate API in ate-system (kubernetes/substrate/).
        substrateClientCertificate:
          enabled: true
      # Bundled substrate subchart off — CRDs + control plane come from
      # platform/ai/kubernetes/substrate/ (substrate-crds + substrate 0.6.0-alpha3).
      substrate:
        enabled: false
      substrateWorkerPool:
        create: true
        name: kagent-default
        sandboxClass: gvisor
        # Must match the separate substrate chart version (0.6.0-alpha3).
        workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v0.6.0-alpha3
        # limits.memory is projected as the worker's actor capacity budget; the
        # controller default of 1Gi is too small for a gVisor sandbox to boot.
        template:
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
      grafana-mcp:
        grafana:
          url: http://grafana-mesh.observability.svc.cluster.local
          secretRef: kagent-grafana-mcp-auth
        # Main Org. — silences mcp-grafana's GRAFANA_ORG_ID warning.
        config:
          GRAFANA_ORG_ID: "1"
        allowedHosts: "*"
        # args:
        #   - --disable-admin
      kagent-tools:
        otel:
          tracing:
            enabled: true
            exporter:
              otlp:
                endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
                timeout: 15
                insecure: true
        tools:
          env:
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
  - name: agentevals
    repo: oci://ghcr.io/agentevals-dev/agentevals/helm
    releaseName: agentevals
    version: 0.12.0
    namespace: ai
    valuesInline:
      replicaCount: 1
      storage:
        backend: postgres
      database:
        postgres:
          urlFile: /etc/agentevals/db/url
          schema: agentevals
          autoMigrate: true
          bundled:
            enabled: false
      env:
        - name: AGENTEVALS_EVALUATION_EVENTS
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-agent-collector.observability.svc.cluster.local:4318
        - name: OTEL_SERVICE_NAME
          value: agentevals
  - name: knowledge-tree
    repo: oci://ghcr.io/teaglebuilt/charts
    releaseName: knowledge-tree
    version: 3.0.0
    namespace: ai
    valuesInline:
      image:
        tag: 0.5.0
      knowledgeScoutAgent:
        enabled: false
      docsAgent:
        kbWriter:
          # Same SOPS Secret as application's kb-api (apps/kb-api).
          tokenSecret: kb-ingest-token
          tokenSecretKey: KB_INGEST_TOKEN
patches:
  - target:
      group: api.kagent.dev
      version: v1alpha3
      kind: RemoteMCPServer
      name: kagent-grafana-mcp
    patch: |
      - op: add
        path: /spec/headersFrom
        value:
          - name: Authorization
            valueFrom:
              type: Secret
              name: kagent-grafana-mcp-auth
              key: MCP_GRAFANA_AUTHORIZATION
