---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - ../../base
  - ../../aigateway
  - ../../llm-providers
  - ../../mcp
  - ../../harness
  - ../../agents
  - ../../routes
helmCharts:
  - name: agentgateway
    repo: oci://ghcr.io/kgateway-dev/charts
    releaseName: agentgateway
    version: v2.2.1
    namespace: ai
  - name: kagent
    repo: oci://ghcr.io/kagent-dev/kagent/helm
    releaseName: kagent
    version: 1.0.0-alpha9
    namespace: ai
    valuesInline:
      kmcp:
        enabled: true
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      providers:
        default: openAI
        openAI:
          provider: OpenAI
          model: "gpt-4o-mini"
          apiKeySecretRef: openai-api-key-secret
          apiKeySecretKey: Authorization
        ollama:
          provider: Ollama
          model: "llama3.2"
          config:
            host: ollama.ai.svc.cluster.local:11434
      controller:
        substrate:
          # Endpoints are derived from the bundled substrate subchart
          # (kagent-api.ai.svc:443, kagent-atenet-router.ai.svc:80).
          enabled: true
      substrate:
        enabled: true
        credentialProvider:
          # Lets agents in `ai` use credentials (ModelConfig Secrets) from `ai`.
          namespacePolicies:
            - atespace: ai
              allowedNamespaces: [ai]
      substrateWorkerPool:
        create: true
        name: kagent-default
        sandboxClass: gvisor
        # ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.4.0-alpha1 (matches substrate 0.4.0-alpha1)
        workerImage: ghcr.io/kagent-dev/substrate/ateom-gvisor@sha256:a1ce5b950724c6167889324df6729ccf8c5b3b2963863f4602c21c17587ba454
      otel:
        exporter:
          otlp:
            endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
            protocol: grpc
            timeout: "15000"
        traces:
          enabled: true
        logs:
          enabled: true
      kagent-tools:
        otel:
          tracing:
            enabled: true
            exporter:
              otlp:
                endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
                timeout: 15
                insecure: true
        tools:
          env:
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
