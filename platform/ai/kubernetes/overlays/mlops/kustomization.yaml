---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../aigateway
  - ../../llm-providers
  - ../../harness
  - ../../prompts
  - ../../agents
  - ../../routes
  - ../../substrate
  - ../../database
  - ../../mcp
  - ../../cost-audit
  - ../../apps/youtube-transcript
  # Bearer shared with application (youtube-transcript, kb-mcp-write -> kb-api over mesh).
  - ../../apps/kb-api
  - ../../apps/kb-api/mesh
helmCharts:
  - name: agentgateway
    repo: oci://ghcr.io/kgateway-dev/charts
    releaseName: agentgateway
    version: v2.2.1
    namespace: ai
  - name: kmcp-crds
    repo: oci://ghcr.io/kagent-dev/kmcp/helm
    releaseName: kmcp-crds
    version: 0.4.0
    namespace: ai
  - name: kmcp
    repo: oci://ghcr.io/kagent-dev/kmcp/helm
    releaseName: kmcp
    version: 0.4.0
    namespace: ai
  - name: kagent
    repo: oci://ghcr.io/kagent-dev/kagent/helm
    releaseName: kagent
    version: 1.0.1
    namespace: ai
    valuesInline:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      config:
        database:
          vectorEnabled: true
        telemetry:
          traces:
            endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
            protocol: grpc
            timeout: 15s
          logs:
            endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
            protocol: grpc
            timeout: 15s
        runtimeDefaults:
          memory: 6Gi
          cpu: "2"
          telemetry:
            captureContent: true
            traces:
              endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
              protocol: grpc
              timeout: 15s
            logs:
              endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
              protocol: grpc
              timeout: 15s
      providers:
        default: openAI
        openAI:
          provider: OpenAI
          model: "gpt-4o-mini"
          apiKeySecretRef: openai-api-key-secret
          apiKeySecretKey: Authorization
        ollama:
          provider: Ollama
          model: "llama3.2"
          config:
            host: ollama.ai.svc.cluster.local:11434
      controller:
        # Mounts the podidentity credential + servicedns CA so the controller can
        # authenticate to the substrate API in ate-system (kubernetes/substrate/).
        substrateClientCertificate:
          enabled: true
      substrateWorkerPool:
        create: true
        name: kagent-default
        # Each Actor claims config.runtimeDefaults (2 CPU / 6Gi), so the 8Gi
        # worker limit below fits exactly one. Fewer workers than concurrent
        # turns fails the golden-actor resume with "no worker has room".
        sandboxClass: gvisor
        # Must match the separate substrate chart version (1.0.0). The v1.0.0
        # ate-controller passes --pod-ips, which v0.6.0-alpha3 workers reject.
        workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.0
        template:
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "6"
              memory: 8Gi
      kagent-tools:
        otel:
          tracing:
            enabled: true
            exporter:
              otlp:
                endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
                timeout: 15
                insecure: true
        tools:
          env:
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
  - name: agentevals
    repo: oci://ghcr.io/agentevals-dev/agentevals/helm
    releaseName: agentevals
    version: 0.12.0
    namespace: ai
    valuesInline:
      replicaCount: 1
      storage:
        backend: postgres
      database:
        postgres:
          urlFile: /etc/agentevals/db/url
          schema: agentevals
          autoMigrate: true
          bundled:
            enabled: false
      env:
        - name: AGENTEVALS_EVALUATION_EVENTS
          value: "true"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-agent-collector.observability.svc.cluster.local:4318
        - name: OTEL_SERVICE_NAME
          value: agentevals
  - name: knowledge-tree
    repo: oci://ghcr.io/teaglebuilt/charts
    releaseName: knowledge-tree
    version: 3.0.1
    namespace: ai
    valuesInline:
      image:
        tag: 0.5.1
      knowledgeScoutAgent:
        enabled: false
      docsAgent:
        kbWriter:
          createRemoteMCPServer: true
          # Same SOPS Secret as application's kb-api (apps/kb-api).
          tokenSecret: kb-ingest-token
          tokenSecretKey: KB_INGEST_TOKEN
