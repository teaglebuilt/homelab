---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: kagent
  namespace: ai
spec:
  kagent:
    compaction:
      tokenThreshold: 22000
      eventRetentionSize: 20
      summarizer:
        modelConfigRef:
          name: llmd-vllm-config
    memory:
      modelConfigRef:
        name: openai-embeddings
  # Prompts/replies on generate_content spans for agentevals graders.
  # Overrides config.runtimeDefaults.telemetry.captureContent for this harness.
  env:
    - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
      value: SPAN_ONLY
  workload:
    image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:2240ef5d46b71b4850d072d40f34a5f778e9342cc97df34a635b594540ec62af
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
