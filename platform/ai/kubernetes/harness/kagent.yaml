---
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: kagent
  namespace: ai
spec:
  kagent:
    compaction:
      tokenThreshold: 22000
      eventRetentionSize: 20
      summarizer:
        modelConfigRef:
          name: llmd-vllm-config
    memory:
      modelConfigRef:
        name: openai-embeddings
  # Prompts/replies on generate_content spans for agentevals graders.
  # Overrides config.runtimeDefaults.telemetry.captureContent for this harness.
  env:
    - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
      value: SPAN_ONLY
  workload:
    image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:d3b1151d39c529a6f921a58a995ff699963012001d2e5075f69bf613abebc24d
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: gs://ate-snapshots/kagent/
