apiVersion: batch/v1
kind: Job
metadata:
  name: kagent-postgres-setup
  namespace: ai
  labels:
    app.kubernetes.io/name: kagent-postgres-setup
    app.kubernetes.io/part-of: homelab
  annotations:
    homelab.teaglebuilt/kagent-postgres-version: v1.0.0-alpha16-1
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagent-postgres-setup
        app.kubernetes.io/part-of: homelab
    spec:
      serviceAccountName: kagent-postgres-setup
      restartPolicy: OnFailure
      containers:
        - name: setup
          # alpine:3.21.3
          image: alpine@sha256:a8560b36e8b8210634f77d9f7f9efd7ffa463e380b75e2e74aff4511df3ef88c
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: NS
              value: ai
            - name: KUBECTL_VERSION
              value: v1.37.1
          command: ["/bin/sh", "-ec"]
          args:
            - |
              apk add --no-cache curl >/dev/null

              arch="$(uname -m)"
              case "$arch" in
                x86_64|amd64) arch=amd64 ;;
                aarch64|arm64) arch=arm64 ;;
                *) echo "unsupported arch: $arch" >&2; exit 1 ;;
              esac

              curl -fsSL -o /tmp/kubectl \
                "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${arch}/kubectl"
              chmod +x /tmp/kubectl
              export PATH="/tmp:${PATH}"

              kubectl -n "$NS" rollout status deployment/kagent-postgresql --timeout=5m

              # Reuse a previously generated password so reruns do not rotate it.
              password_for() {
                existing="$(kubectl -n "$NS" get secret "$1" -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true)"
                if [ -n "$existing" ]; then printf '%s' "$existing"; else head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n'; fi
              }
              owner_pw="$(password_for kagent-postgres-owner)"
              readwrite_pw="$(password_for kagent-postgres-readwrite)"

              psql_exec() {
                kubectl -n "$NS" exec -i deploy/kagent-postgresql -c postgresql -- \
                  psql --no-psqlrc --set=ON_ERROR_STOP=1 --single-transaction \
                  --username=kagent --dbname=kagent "$@"
              }

              # Idempotent: advisory-locked, and every object is created only if absent.
              psql_exec \
                --set=substrate_schema=kagent \
                --set=substrate_owner_role=kagent_owner \
                --set=substrate_owner_user=kagent_owner_user \
                --set="substrate_owner_password=${owner_pw}" \
                --set=substrate_readwrite_role=kagent_readwrite \
                --set=substrate_readwrite_user=kagent_readwrite_user \
                --set="substrate_readwrite_password=${readwrite_pw}" < /sql/setup.sql

              psql_exec < /sql/setup-extensions.sql

              make_conn_secret() {
                secret="$1"; key="$2"; user="$3"; pw="$4"
                kubectl -n "$NS" create secret generic "$secret" \
                  --from-literal="${key}=postgres://${user}:${pw}@kagent-postgresql.${NS}.svc:5432/kagent?sslmode=disable" \
                  --from-literal="password=${pw}" \
                  --dry-run=client -o yaml | kubectl apply -f -
              }

              make_conn_secret kagent-postgres-readwrite \
                readWriteConnectionString kagent_readwrite_user "$readwrite_pw"
              make_conn_secret kagent-postgres-owner \
                ownerConnectionString kagent_owner_user "$owner_pw"

              echo "kagent postgres setup complete"
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: sql
          configMap:
            name: kagent-postgres-setup-sql
