---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kagent-postgres-setup
  namespace: ai
  labels:
    app.kubernetes.io/name: kagent-postgres-setup
    app.kubernetes.io/part-of: homelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kagent-postgres-setup
  namespace: ai
  labels:
    app.kubernetes.io/name: kagent-postgres-setup
    app.kubernetes.io/part-of: homelab
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kagent-postgres-setup
  namespace: ai
  labels:
    app.kubernetes.io/name: kagent-postgres-setup
    app.kubernetes.io/part-of: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kagent-postgres-setup
subjects:
  - kind: ServiceAccount
    name: kagent-postgres-setup
    namespace: ai
