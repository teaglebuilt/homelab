---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
  - rbac.yaml
  - setup-job.yaml
generators:
  - secrets-generator.yaml
configMapGenerator:
  - name: kagent-postgres-setup-sql
    namespace: ai
    files:
      - setup.sql
      - setup-extensions.sql
generatorOptions:
  # Job pod specs are immutable; a hashed name would change the volume ref.
  disableNameSuffixHash: true
