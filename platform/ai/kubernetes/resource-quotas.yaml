---
# Namespace-wide defaults for the ai namespace. Sized to fit a single GPU
# LLM provider (vLLM / NIM / Ollama) plus gateway/controller headroom on
# mlops-work-00 (~15.5Gi allocatable memory, 1x nvidia.com/gpu).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-resource-quotas
  namespace: ai
spec:
  hard:
    limits.cpu: "16"
    limits.memory: 24Gi
    limits.ephemeral-storage: 20Gi
    requests.cpu: "8"
    requests.memory: 16Gi
    requests.ephemeral-storage: 10Gi
    requests.nvidia.com/gpu: "1"
    limits.nvidia.com/gpu: "1"
