---
# NOT currently applied - not referenced by any kustomization. See
# kubernetes/apps/hardware/nvidia/README.md before activating; a namespace quota
# rejects pods once the declared totals are exceeded.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-resource-quotas
  namespace: ai
spec:
  hard:
    limits.cpu: "32"
    limits.memory: 26Gi
    limits.ephemeral-storage: 20Gi
    requests.cpu: "8"
    requests.memory: 14Gi
    requests.ephemeral-storage: 10Gi
    requests.nvidia.com/gpu: "1"
    limits.nvidia.com/gpu: "1"
