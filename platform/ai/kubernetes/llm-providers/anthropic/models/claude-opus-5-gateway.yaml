---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: claude-opus-5-gateway
  namespace: ai
  labels:
    app: anthropic
    component: model-config
    ai.homelab/tier: premium
    ai.homelab/paid: "true"
    ai.homelab/route: gateway
spec:
  provider: Anthropic
  model: claude-opus-5
  apiKeySecret: anthropic-api-key
  apiKeySecretKey: Authorization
  stream: true
  anthropic:
    baseUrl: http://ai-gateway.ai.svc.cluster.local/anthropic
    promptCaching: true
    cacheTTL: "5m"
