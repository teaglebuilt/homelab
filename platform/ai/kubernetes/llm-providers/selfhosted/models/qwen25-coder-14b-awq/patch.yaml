---
# Coding profile for RTX 4070 SUPER 12GB.
# Weights ~9.9GB AWQ leave ~1GiB KV at util 0.95 — 8192 needs 1.5GiB and fails.
# Tool calling uses the out-of-tree qwen2_5_coder plugin (see ../qwen25-coder-tools).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-selfhosted
  labels:
    homelab.teaglebuilt.dev/model: qwen25-coder-14b-awq
  annotations:
    homelab.teaglebuilt.dev/hf-model: Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
spec:
  template:
    metadata:
      labels:
        homelab.teaglebuilt.dev/model: qwen25-coder-14b-awq
      annotations:
        homelab.teaglebuilt.dev/hf-model: Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
    spec:
      containers:
        - name: vllm
          args:
            # v0.13+: model is a positional arg to `vllm serve` (not --model).
            - "Qwen/Qwen2.5-Coder-14B-Instruct-AWQ"
            - "--served-model-name"
            - "vllm-selfhosted"
            - "--port"
            - "8000"
            - "--max-model-len"
            - "4096"
            - "--gpu-memory-utilization"
            - "0.95"
            - "--enable-auto-tool-choice"
            - "--enable-prefix-caching"
            - "--tool-parser-plugin"
            - "/opt/vllm-parsers/qwen2_5_coder_tool_parser.py"
            - "--tool-call-parser"
            - "qwen2_5_coder"
            - "--chat-template"
            - "/opt/vllm-parsers/tool_chat_template_qwen2_5_coder.jinja"
            - "--max-num-seqs"
            - "8"
            - "--enforce-eager"
