---
# Coding profile for RTX 4070 SUPER 12GB.
# hf-mem: weights 9.29GiB + vLLM overhead ~1.35GiB leaves no room to raise
# context. 8192 needs 11.40GiB vs 10.80GiB usable; 4096 is the safe ceiling.
# Retest: uvx hf-mem Qwen/Qwen2.5-Coder-14B-Instruct-AWQ --gpu-memory 12 \
#   --max-model-len 8192 --kv-cache-dtype fp8
# Tool calling uses the out-of-tree qwen2_5_coder plugin (see ../qwen25-coder-tools).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-selfhosted
  labels:
    homelab.teaglebuilt.dev/model: qwen25-coder-14b-awq
  annotations:
    homelab.teaglebuilt.dev/hf-model: Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
spec:
  template:
    metadata:
      labels:
        homelab.teaglebuilt.dev/model: qwen25-coder-14b-awq
      annotations:
        homelab.teaglebuilt.dev/hf-model: Qwen/Qwen2.5-Coder-14B-Instruct-AWQ
    spec:
      containers:
        - name: vllm
          args:
            # v0.13+: model is a positional arg to `vllm serve` (not --model).
            - "Qwen/Qwen2.5-Coder-14B-Instruct-AWQ"
            - "--served-model-name"
            - "vllm-selfhosted"
            - "--port"
            - "8000"
            - "--max-model-len"
            - "4096"
            - "--gpu-memory-utilization"
            - "0.95"
            - "--enable-auto-tool-choice"
            - "--enable-prefix-caching"
            - "--kv-cache-dtype"
            - "fp8"
            - "--tool-parser-plugin"
            - "/opt/vllm-parsers/qwen2_5_coder_tool_parser.py"
            - "--tool-call-parser"
            - "qwen2_5_coder"
            - "--chat-template"
            - "/opt/vllm-parsers/tool_chat_template_qwen2_5_coder.jinja"
            - "--max-num-seqs"
            - "8"
            - "--enforce-eager"
