---
# Faster coding profile — more KV headroom / longer context on 12GB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-selfhosted
  labels:
    homelab.teaglebuilt.dev/model: qwen25-coder-7b-awq
  annotations:
    homelab.teaglebuilt.dev/hf-model: Qwen/Qwen2.5-Coder-7B-Instruct-AWQ
spec:
  template:
    metadata:
      labels:
        homelab.teaglebuilt.dev/model: qwen25-coder-7b-awq
      annotations:
        homelab.teaglebuilt.dev/hf-model: Qwen/Qwen2.5-Coder-7B-Instruct-AWQ
    spec:
      containers:
        - name: vllm
          args:
            - "--model"
            - "Qwen/Qwen2.5-Coder-7B-Instruct-AWQ"
            - "--served-model-name"
            - "vllm-selfhosted"
            - "--port"
            - "8000"
            - "--max-model-len"
            - "32768"
            - "--gpu-memory-utilization"
            - "0.92"
            - "--enable-auto-tool-choice"
            - "--enable-prefix-caching"
            - "--tool-call-parser"
            - "hermes"
            - "--max-num-seqs"
            - "32"
            - "--enforce-eager"
