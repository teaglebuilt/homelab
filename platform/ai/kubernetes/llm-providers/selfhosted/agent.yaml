---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: llmd-inference-agent
  namespace: ai
spec:
  description: >-
    Agent that routes LLM requests to the self-hosted vLLM OpenAI-compatible
    server running on the mlops GPU node.
  modelConfig:
    name: llmd-vllm-config
  systemPrompt: |-
    You are a helpful assistant served by a self-hosted vLLM instance on
    the homelab mlops cluster (open-weight models on the RTX 4070).

    # Instructions

    - Answer user questions clearly and concisely
    - If a question is unclear, ask for clarification
    - If you don't know the answer, say so honestly

    # Response format
    - Format responses as Markdown
    - Keep answers focused and relevant
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: llmd-inference-agent
  namespace: ai
spec:
  templateRef:
    name: llmd-inference-agent
  harnessRef:
    name: kagent
