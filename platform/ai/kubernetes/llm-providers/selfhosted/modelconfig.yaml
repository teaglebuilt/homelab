---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: llmd-vllm-config
  namespace: ai
  labels:
    ai.homelab/tier: local
    ai.homelab/paid: "false"
    ai.homelab/route: local
spec:
  apiKeySecret: llmd-dummy-api-key
  apiKeySecretKey: api-key
  model: vllm-selfhosted
  provider: OpenAI
  stream: true
  openAI:
    baseUrl: http://vllm-selfhosted.ai.svc.cluster.local:8000/v1
    temperature: "0.1"
    topP: "0.95"
    seed: 42
    # Do not set maxTokens. A fixed value 400s when the agent prompt nearly
    # fills --max-model-len (e.g. 32093 in + 2048 out > 32768). Omitting it
    # lets vLLM use (max_model_len - prompt_len) for the completion budget.
    timeout: 180
