---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: llmd-vllm-config
  namespace: ai
spec:
  apiKeySecret: llmd-dummy-api-key
  apiKeySecretKey: api-key
  model: vllm-selfhosted
  provider: OpenAI
  stream: true
  openAI:
    baseUrl: http://vllm-selfhosted.ai.svc.cluster.local:8000/v1
    temperature: "0.1"
    topP: "0.95"
    seed: 42
    maxTokens: 4096
    timeout: 180
