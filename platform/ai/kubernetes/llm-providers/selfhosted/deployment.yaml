---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-selfhosted
  namespace: ai
  labels:
    app: vllm-selfhosted
    app.kubernetes.io/name: vllm-selfhosted
    app.kubernetes.io/part-of: homelab
    component: llm-provider
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-selfhosted
  template:
    metadata:
      labels:
        app: vllm-selfhosted
        app.kubernetes.io/name: vllm-selfhosted
        app.kubernetes.io/part-of: homelab
        component: llm-provider
    spec:
      priorityClassName: gpu-serving # or gpu-training
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: vllm
          # Node driver 570.172.08 exposes CUDA 12.8. v0.25.1 requires CUDA 13;
          # v0.11.0 is the pinned CUDA 12.8-compatible OpenAI server image.
          image: vllm/vllm-openai:v0.11.0
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            # Safe first boot on 12GB VRAM (4070 SUPER). Step up to AWQ 7–8B later.
            - "Qwen/Qwen2.5-3B-Instruct"
            - "--served-model-name"
            - "vllm-selfhosted"
            - "--port"
            - "8000"
            - "--max-model-len"
            - "4096"
            - "--gpu-memory-utilization"
            - "0.85"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "hermes"
            # Mirror NIM's CUDA-graph disable on this GPU — capture often OOMs at startup.
            - "--enforce-eager"
          env:
            - name: HF_HOME
              value: /data/providers/vllm
            - name: HUGGINGFACE_HUB_CACHE
              value: /data/providers/vllm
            - name: PYTORCH_ALLOC_CONF
              value: expandable_segments:True
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
              nvidia.com/gpu: "1"
            limits:
              # Node has ~15.5Gi allocatable; leave headroom for kubelet/system (same ceiling as NIM).
              cpu: "4"
              memory: 12Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            failureThreshold: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: hf-cache
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      terminationGracePeriodSeconds: 60
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: vllm-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
