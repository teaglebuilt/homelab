---
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: embedding-model-openai
  namespace: ai
  labels:
    app: kagent
    component: model-config
spec:
  provider: OpenAI
  model: text-embedding-3-small
  apiKeySecret: openai-api-key-secret
  apiKeySecretKey: Authorization

# Notes:
# - This ModelConfig configures a dedicated embeddings model that kagent memory
#   can reference (Agent.spec.declarative.memory.modelConfig).
# - We prefer a hosted embeddings provider (OpenAI) for quality and fixed
#   dimensionality. If you have a self-hosted embedding endpoint that is
#   OpenAI-compatible (for example, a vLLM instance configured to serve an
#   embeddings model), you can instead point the ModelConfig.baseUrl at that
#   endpoint and set model to the served embedding model name.
