---
# AgentgatewayBackend: gateway.kgateway.dev Backend does not support spec.ai in this cluster.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openai
  namespace: ai
spec:
  ai:
    provider:
      openai: {}
  policies:
    auth:
      secretRef:
        name: openai-api-key-secret
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/embeddings": Embeddings
        "/v1/models": Passthrough
