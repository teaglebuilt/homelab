---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: comfyui-mcp-server
  namespace: ai
  labels:
    app: comfyui-mcp-server
spec:
  deployment:
    image: node:24-alpine3.21          # artokun/comfyui-mcp requires Node >= 22
    cmd: npx
    args:
      - "-y"
      - comfyui-mcp
    port: 3000
    env:
      COMFYUI_URL: "http://comfyui.ai.svc.cluster.local"   # Service :80 -> pod :8188
  transportType: stdio
