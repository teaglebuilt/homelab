---
apiVersion: v1
kind: Service
metadata:
  name: comfyui-mcp-federation
  namespace: ai
  labels:
    app: comfyui-mcp-server
    agentgateway.dev/mcp-federation: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: comfyui-mcp-server
  ports:
    - name: mcp
      port: 3000
      targetPort: 3000
      protocol: TCP
      appProtocol: kgateway.dev/mcp
