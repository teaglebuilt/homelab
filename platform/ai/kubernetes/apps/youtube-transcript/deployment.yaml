---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-transcript
  namespace: ai
  labels:
    app.kubernetes.io/name: youtube-transcript
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: youtube-transcript
  template:
    metadata:
      labels:
        app.kubernetes.io/name: youtube-transcript
        app.kubernetes.io/part-of: homelab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: youtube-transcript
          image: ghcr.io/teaglebuilt/youtube-transcript:0.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: YT_LANGUAGES
              value: "en"
            - name: KB_INGEST_URL
              value: http://kb-ingest.ai.svc.cluster.local:3000
            - name: KB_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kb-ingest-token
                  key: KB_INGEST_TOKEN
                  optional: true
          envFrom:
            - secretRef:
                name: youtube-transcript-proxy
                optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
