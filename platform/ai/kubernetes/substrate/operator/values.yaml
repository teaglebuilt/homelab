---
# Substrate chart values (not kagent). See:
# oci://ghcr.io/kagent-dev/substrate/helm/substrate:1.0.0
# kagent 1.0.1 compiles every ActorTemplate with snapshot_config.storage_location
# (required by the Harness CRD) and golden_egress_policy. Without both gates the
# substrate API rejects them Forbidden and no Agent reaches Ready.
preview: [GoldenEgressPolicy, PerTemplateSnapshotLocation]

credentialProvider:
  # Lets actors in atespace `ai` read ModelConfig Secrets in namespace `ai`.
  namespacePolicies:
    - atespace: ai
      allowedNamespaces: [ai]

ateApi:
  authorization:
    # Setting this replaces the chart default (the shared ate-client), so keep it.
    # The kagent controller authenticates with its pod certificate; its SPIFFE ID
    # is the principal.
    bootstrapOwners:
      - system:serviceaccount:ate-system:ate-client
      - spiffe://cluster.local/ns/ai/sa/kagent-controller

postgres:
  # Connection strings reference /run/postgres.podcert.ate.dev/*.pem, which
  # ate-api-server only mounts when this is on.
  clientCertificates:
    enabled: true

rustfs:
  enabled: true
  storageSize: 1Gi

otel:
  endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
  traces:
    # 1.0 so every trace_id appearing in a substrate log line resolves to a span
    # in Tempo. Below 1.0 the Loki->Tempo derived field yields dead links for the
    # unsampled majority.
    samplingRatio: 1.0

atelet:
  # Bundled atelet is deprecated: it moves atelet and ate-api-server in one
  # upgrade, which the version skew policy forbids. Installed from ../atelet.
  enabled: false
