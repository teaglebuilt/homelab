---
# Substrate chart values (not kagent). See:
# oci://ghcr.io/kagent-dev/substrate/helm/substrate:0.5.0-alpha1
credentialProvider:
  # Lets actors in atespace `ai` read ModelConfig Secrets in namespace `ai`.
  namespacePolicies:
    - atespace: ai
      allowedNamespaces: [ai]

rustfs:
  enabled: true
  storageSize: 1Gi
