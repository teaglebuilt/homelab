---
# Deploy via overlays — do not build this directory directly.
#   overlays/mlops        GPU stack (kagent, ai-gateway, LLM providers, mcp)
#   overlays/application  open-webui + openedai-speech (+ ClusterMesh front)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - overlays/mlops
