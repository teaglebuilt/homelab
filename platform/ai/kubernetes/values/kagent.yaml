---
kmcp:
  enabled: true
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
database:
  postgres:
    role: kagent
    vectorEnabled: false
providers:
  default: openAI
  openAI:
    provider: OpenAI
    model: "gpt-4o-mini"
    apiKeySecretRef: openai-api-key-secret
    apiKeySecretKey: Authorization
  ollama:
    provider: Ollama
    model: "llama3.2"
    config:
      host: ollama.ai.svc.cluster.local:11434
controller:
  substrate:
    # Separate substrate release in ate-system (platform/ai/kubernetes/substrate/).
    enabled: true
    ateApiEndpoint: dns:///api.ate-system.svc:443
    atenetRouterURL: http://atenet-router.ate-system.svc:80
# Bundled substrate subchart off — CRDs + control plane come from
# platform/ai/kubernetes/substrate/ (substrate-crds + substrate 0.5.0-alpha1).
substrate:
  enabled: false
substrateWorkerPool:
  create: true
  name: kagent-default
  sandboxClass: gvisor
  # Must match the separate substrate chart version (0.5.0-alpha1).
  workerImage: ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.5.0-alpha1
  # limits.memory is projected as the worker's actor capacity budget; the
  # controller default of 1Gi is too small for a gVisor sandbox to boot.
  template:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "4"
        memory: 4Gi
otel:
  exporter:
    otlp:
      endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
      protocol: grpc
      timeout: "15000"
  traces:
    enabled: true
  logs:
    enabled: true
kagent-tools:
  otel:
    tracing:
      enabled: true
      exporter:
        otlp:
          endpoint: http://otel-agent-collector.observability.svc.cluster.local:4317
          timeout: 15
          insecure: true
  tools:
    env:
      - name: OTEL_EXPORTER_OTLP_PROTOCOL
        value: grpc
