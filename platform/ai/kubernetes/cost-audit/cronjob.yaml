apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-cost-audit
  namespace: ai
  labels:
    app.kubernetes.io/name: ai-cost-audit
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 90
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: ai-cost-audit
          containers:
            - name: audit
              image: python:3.13-alpine
              imagePullPolicy: IfNotPresent
              command: ["python", "/scripts/ai-cost-audit.py"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 25m
                  memory: 48Mi
                limits:
                  cpu: 200m
                  memory: 96Mi
          volumes:
            - name: scripts
              configMap:
                name: ai-cost-audit-scripts
