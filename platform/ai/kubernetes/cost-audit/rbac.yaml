# CronJob ai-cost-audit reads kagent objects with this account and pushes ai_agent_info over OTLP.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-cost-audit
  namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-cost-audit
  namespace: ai
rules:
  - apiGroups: ["api.kagent.dev"]
    resources: ["agents", "agenttemplates", "modelconfigs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-cost-audit
  namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-cost-audit
subjects:
  - kind: ServiceAccount
    name: ai-cost-audit
    namespace: ai
