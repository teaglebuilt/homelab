---
version: 3

vars:
  AI_NAMESPACE: ai
  AGENTGATEWAY_VERSION: v1.6.0

tasks:
  deploy:
    dir: ai
    desc: Deploy AI platform via Helmfile stage 05 (per-cluster)
    requires:
      vars: [CLUSTER]
    vars:
      KUBECONFIG_FILE: '{{.ROOT_DIR}}/kubernetes/generated/{{.CLUSTER}}/kubeconfig'
    cmds:
      - |
        KUBECONFIG='{{.KUBECONFIG_FILE}}' helmfile \
          -f '{{.ROOT_DIR}}/kubernetes/clusters/{{.CLUSTER}}/helmfile.yaml' \
          sync --selector tier=platform,stack=ai

  destroy:
    dir: ai
    desc: Destroy disposable AI releases (excludes CRDs and stateful)
    requires:
      vars: [CLUSTER]
    vars:
      KUBECONFIG_FILE: '{{.ROOT_DIR}}/kubernetes/generated/{{.CLUSTER}}/kubeconfig'
    cmds:
      - |
        KUBECONFIG='{{.KUBECONFIG_FILE}}' helmfile \
          -f '{{.ROOT_DIR}}/kubernetes/clusters/{{.CLUSTER}}/helmfile.yaml' \
          destroy --selector stack=ai,lifecycle=stateless

  test:
    cmds:
      - |-
        curl --insecure http://ai.homelab.internal/api/generate -d '{ "model": "qwen2.5-coder:latest", "prompt": "How are you today?", "stream": false}'

  check-gpu:
    cmds:
      - kubectl describe node mlops-work-00 | grep -A5 "Capacity"

  create-nvcr-secret:
    vars:
      CLUSTER: '{{.CLUSTER | default "mlops"}}'
      KUBECONFIG_FILE: '{{.ROOT_DIR}}/kubernetes/generated/{{.CLUSTER}}/kubeconfig'
    cmds:
      - |-
        KUBECONFIG='{{.KUBECONFIG_FILE}}' kubectl create secret docker-registry ngc-secret -n ai \
          --docker-server=nvcr.io \
          --docker-username='$oauthtoken' \
          --docker-password='{{.NGC_API_KEY}}'

  build-claude-harness:
    desc: Build and push the Claude harness with a newer Claude Code (VERSION=latest by default)
    vars:
      VERSION: '{{.VERSION | default "latest"}}'
      REGISTRY: '{{.REGISTRY | default "ghcr.io/nextgensolutions-llc"}}'
      PLATFORMS: '{{.PLATFORMS | default "linux/amd64"}}'
      CLAUDE_CODE_VERSION:
        sh: |
          v='{{.VERSION}}'
          [ "$v" = latest ] && v="$(curl -fsS https://downloads.claude.ai/claude-code-releases/latest)"
          echo "$v"
    cmds:
      - |-
        docker buildx build \
          --platform '{{.PLATFORMS}}' \
          --build-arg CLAUDE_CODE_VERSION='{{.CLAUDE_CODE_VERSION}}' \
          -f '{{.TASKFILE_DIR}}/kubernetes/harness/Dockerfile.claude' \
          -t '{{.REGISTRY}}/claude-harness:{{.CLAUDE_CODE_VERSION}}' \
          --push '{{.TASKFILE_DIR}}/kubernetes/harness'
      - docker buildx imagetools inspect '{{.REGISTRY}}/claude-harness:{{.CLAUDE_CODE_VERSION}}' --format '{{"{{"}}.Manifest.Digest{{"}}"}}'
