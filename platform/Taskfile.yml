---
version: 3

includes:
  data:
    taskfile: data/Taskfile.yml
  ai:
    taskfile: ai/Taskfile.yml
  automation:
    taskfile: automation/Taskfile.yml
  downloads:
    taskfile: downloads/Taskfile.yml
  media:
    taskfile: media/Taskfile.yml
  observability:
    taskfile: observability/Taskfile.yml
  research:
    taskfile: research/Taskfile.yml

tasks:
  deploy:
    dir: platform
    summary: 'Deploy platform via cluster Helmfile (stages 00-06)'
    requires:
      vars: [CLUSTER]
    cmds:
      - task: kubernetes:sync-cluster
        vars:
          CLUSTER: '{{.CLUSTER}}'

  destroy:
    dir: platform
    summary: 'Destroy only disposable (lifecycle=stateless) platform releases'
    requires:
      vars: [CLUSTER]
    vars:
      KUBECONFIG_FILE: '{{.ROOT_DIR}}/kubernetes/generated/{{.CLUSTER}}/kubeconfig'
    cmds:
      - |
        KUBECONFIG='{{.KUBECONFIG_FILE}}' helmfile \
          -f '{{.ROOT_DIR}}/kubernetes/clusters/{{.CLUSTER}}/helmfile.yaml' \
          destroy --selector lifecycle=stateless

  test:
    dir: platform
    cmds:
      - task: ai:test
