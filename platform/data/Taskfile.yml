---
version: 3

tasks:
  deploy:
    requires:
      vars: [CLUSTER]
    vars:
      KUBECONFIG_FILE: '{{.ROOT_DIR}}/kubernetes/generated/{{.CLUSTER}}/kubeconfig'
    cmds:
      - |
        KUBECONFIG='{{.KUBECONFIG_FILE}}' helmfile \
          -f '{{.ROOT_DIR}}/kubernetes/clusters/{{.CLUSTER}}/helmfile.yaml' \
          sync --selector tier=platform,stack=data

  destroy:
    requires:
      vars: [CLUSTER]
    summary: Data stack is stateful — destroy is a no-op by default
    cmds:
      - echo "Refusing to destroy data stack (lifecycle=stateful). Use an explicit helmfile destroy if intentional."
