---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qdrant
  annotations:
    external-dns.alpha.kubernetes.io/hostname: qdrant.homelab.internal
spec:
  parentRefs:
    - name: homelab-internal-gateway
      namespace: kube-system
      sectionName: https
  hostnames:
    - qdrant.homelab.internal
  rules:
    - backendRefs:
        - name: qdrant
          port: 6333
