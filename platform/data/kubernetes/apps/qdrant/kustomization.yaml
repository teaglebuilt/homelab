---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
resources:
  - httproute.yaml
helmCharts:
  - name: qdrant
    repo: https://qdrant.github.io/qdrant-helm
    namespace: data
    version: 1.14.1
    releaseName: qdrant
    includeCRDs: true
    valuesInline:
      # readOnlyApiKey:
      #   valueFrom:
      #     secretKeyRef:
      #       name: qdrant-secrets
      #       key: qdrant_api_key
      # apiKey:
      #   valueFrom:
      #     secretKeyRef:
      #       name: qdrant-secrets
      #       key: qdrant_api_key
      apiKey: your-super-secret-api-key
      config:
        api_key: your-super-secret-api-key
        cluster:
          enabled: "false"
          p2p:
            port: 6335
            enable_tls: "false"
          consensus:
            tick_period_ms: 200
      service:
        type: ClusterIP

# helmCharts inflate before NamespaceTransformer in some kustomize versions,
# so chart objects omit metadata.namespace. Force it onto release-labeled objects.
patches:
  - target:
      labelSelector: "app.kubernetes.io/instance=qdrant"
    patch: |-
      - op: add
        path: /metadata/namespace
        value: data
  - target:
      kind: Service
      name: qdrant
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: qdrant
        annotations:
          # ClusterMesh: share backends with the mlops front-door Service
          # (overlays/mlops → mesh-service.yaml). DNS: qdrant.data.svc.cluster.local
          service.cilium.io/global: "true"
          service.cilium.io/shared: "true"
          service.cilium.io/affinity: "local"
  - target:
      kind: Service
      name: qdrant-headless
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: qdrant-headless
        annotations:
          external-dns.alpha.kubernetes.io/exclude: "true"

generators:
  - secrets-generator.yaml
