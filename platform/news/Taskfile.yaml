---
version: 3

vars:
  TERRAFORM: tofu -chdir=terraform
  KUSTOMIZE_FLAGS: --enable-helm --enable-exec --enable-alpha-plugins

tasks:
  gen-opml:
    dir: news
    desc: Generate FreshRSS OPML seeds from the YouTube subscriptions source of truth
    cmds:
      - |-
        python3 .claude/skills/youtube/scripts/generate_opml.py \
          --input youtube-subscriptions.yaml \
          --output kubernetes/apps/freshrss/opml/youtube-subscriptions.opml
      - |-
        {
          sha256sum kubernetes/apps/freshrss/opml/*.opml
          sha256sum kubernetes/apps/freshrss/scripts/provision.sh
        } | sha256sum | awk '{print $1}' > kubernetes/apps/freshrss/opml/.checksum

  deploy:
    dir: news
    desc: Deploy FreshRSS (application cluster only — skipped elsewhere so platform:deploy can continue)
    # deps: [gen-opml]
    vars:
      CLUSTER: '{{.CLUSTER | default "application"}}'
      KUBECONFIG_FILE: '{{.ROOT_DIR}}/kubernetes/generated/{{.CLUSTER}}/kubeconfig'
    cmds:
      - |-
        if [ '{{.CLUSTER}}' != 'application' ]; then
          echo "news:deploy skipped for CLUSTER={{.CLUSTER}} (FreshRSS is application-only)"
          exit 0
        fi
        kustomize build {{.KUSTOMIZE_FLAGS}} ./kubernetes/overlays/application | KUBECONFIG='{{.KUBECONFIG_FILE}}' kubectl apply -f -
        KUBECONFIG='{{.KUBECONFIG_FILE}}' kubectl rollout status deployment/freshrss -n feeds --timeout=180s

  destroy:
    dir: news
    vars:
      CLUSTER: '{{.CLUSTER | default "application"}}'
      KUBECONFIG_FILE: '{{.ROOT_DIR}}/kubernetes/generated/{{.CLUSTER}}/kubeconfig'
    cmds:
      - |-
        if [ '{{.CLUSTER}}' != 'application' ]; then
          echo "news:destroy skipped for CLUSTER={{.CLUSTER}} (FreshRSS is application-only)"
          exit 0
        fi
        kustomize build {{.KUSTOMIZE_FLAGS}} ./kubernetes/overlays/application | KUBECONFIG='{{.KUBECONFIG_FILE}}' kubectl delete -f -
