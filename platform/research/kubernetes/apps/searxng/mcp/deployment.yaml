---
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: searxng-mcp
  namespace: research
  labels:
    app.kubernetes.io/name: searxng-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: search-agent
spec:
  # agentgateway wraps the image entrypoint over stdio and serves HTTP /mcp + /sse.
  # Named searxng-mcp so the generated Service does not clash with Service/searxng.
  transportType: stdio
  stdioTransport: {}
  timeout: 60s
  deployment:
    # renovate: datasource=docker registryUrl=https://docker.io depName=isokoliuk/mcp-searxng
    image: docker.io/isokoliuk/mcp-searxng:2.11@sha256:5247ef2c87a2e33f5e5a73a9d05001a6415488060f667c32b732159bca55b45d
    port: 8080
    # Image ENTRYPOINT is replaced by agentgateway; restate the MCP process here.
    cmd: node
    args:
      - dist/cli.js
    env:
      SEARXNG_URL: "http://searxng.research.svc.cluster.local:8080"
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
