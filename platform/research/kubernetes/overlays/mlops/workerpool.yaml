---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: research-worker
  namespace: research
  labels:
    app.kubernetes.io/name: research-worker
    app.kubernetes.io/part-of: search-agent
---
apiVersion: ate.dev/v1
kind: WorkerPool
metadata:
  name: research-default
  namespace: research
  labels:
    app.kubernetes.io/name: research-default
    app.kubernetes.io/part-of: search-agent
spec:
  replicas: 1
  workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.0
  sandboxClasses:
    - name: gvisor
      configRef:
        name: gvisor-default
  template:
    serviceAccountName: research-worker
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "4"
        memory: 6Gi
