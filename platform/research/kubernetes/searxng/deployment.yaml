---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: research
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
      initContainers:
        - name: fix-perms
          image: docker.io/library/busybox:1.37
          command:
            - sh
            - -c
            - chown -R 977:977 /var/cache/searxng /tmp
          volumeMounts:
            - name: cache
              mountPath: /var/cache/searxng
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
      containers:
        - name: searxng
          image: docker.io/searxng/searxng:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SEARXNG_BASE_URL
              value: https://searxng.homelab.internal/
            - name: SEARXNG_BIND_ADDRESS
              value: 0.0.0.0
            - name: SEARXNG_PORT
              value: "8080"
            - name: TMPDIR
              value: /tmp
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-secrets
                  key: SEARXNG_SECRET
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: cache
              mountPath: /var/cache/searxng
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: settings
          configMap:
            name: searxng-settings
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
