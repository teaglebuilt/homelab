---
version: 3

vars:
  KUSTOMIZE_FLAGS: --enable-helm --enable-exec --enable-alpha-plugins

tasks:
  deploy:
    vars:
      CLUSTER: '{{.CLUSTER | default "application"}}'
      KUBECONFIG_FILE: '{{.ROOT_DIR}}/kubernetes/generated/{{.CLUSTER}}/kubeconfig'
    cmds:
      - |-
        export KUBECONFIG='{{.KUBECONFIG_FILE}}'
        kustomize build {{.KUSTOMIZE_FLAGS}} ./research/kubernetes/overlays/{{.CLUSTER}} | kubectl apply -f -

  destroy:
    vars:
      CLUSTER: '{{.CLUSTER | default "application"}}'
      KUBECONFIG_FILE: '{{.ROOT_DIR}}/kubernetes/generated/{{.CLUSTER}}/kubeconfig'
    cmds:
      - |-
        export KUBECONFIG='{{.KUBECONFIG_FILE}}'
        kustomize build {{.KUSTOMIZE_FLAGS}} ./research/kubernetes/overlays/{{.CLUSTER}} | kubectl delete -f -
