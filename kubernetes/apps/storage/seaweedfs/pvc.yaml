---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: storage
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/part-of: homelab
spec:
  accessModes:
    - ReadWriteOnce
  # Keep on local-path (not nfs-csi): SeaweedFS is the hot S3 path for Loki/Tempo.
  # local-path does not enforce quota — real capacity is the worker node's disk
  # (application-work-00 disk_size in kubernetes/terraform/application/main.tf).
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
