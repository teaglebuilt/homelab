---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu-xid-recovery
  namespace: kube-system
spec:
  groups:
    - name: gpu.xid
      rules:
        - alert: GPUXidFatalError
          expr: |
            increase(DCGM_FI_DEV_XID_ERRORS{xid=~"119|79|74|13"}[2m]) > 0
          for: 0m
          labels:
            severity: critical
            component: gpu
          annotations:
            summary: "Fatal GPU XID {{ $labels.xid }} on {{ $labels.Hostname }}"
            description: |
              A fatal XID ({{ $labels.xid }}) was reported by DCGM on host
              {{ $labels.Hostname }}. XID 119 = GSP RPC timeout (Thunderbolt
              eGPU symptom). XID 79 = GPU fallen off bus. See docs/adr/0001
              for recovery procedures.
