---
enable:
  gpu: false              # no GPU on application
  wasm: false             # no WASM runtime on application
  gateway: true           # homelab-gateway (kgateway) — exposes HTTP workloads
  certManager: true       # cert-manager (independent per-cluster CA)
  cnpg: true              # CloudNativePG operator
  frontDoor: true         # cloudflare-tunnel + public external-dns live HERE
  publicGateway: true     # homelab-external-gateway + tunnel — n8n moved here
  gitops: false           # argocd (Phase 2 seam)
  grafanaOperator: true   # grafana-operator: manages Grafana datasources/dashboards via CRDs (Grafana itself ships with kube-prometheus-stack)
  hubbleRoute: true       # application owns hubble.homelab.internal
  clusterMesh: true       # include clustermesh overlay in normal helmfile syncs (not only mesh-upgrade path)

nodeSelector:
  certManager: {}
  cnpg: {}

externalGateway:
  loadBalancerIP: "192.168.2.241"

externalDomain: teaglebuilt.tech
