---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

x-vars: &vars
  CLUSTER_DIR: "{{.CLUSTER_DIR}}"
  CONTROLLER:
    sh: talosctl config info --output json | jq --raw-output '.endpoints[]' | shuf -n 1

tasks:
  ensure-shared-ca:
    summary: Generate the shared Cilium mesh CA (SOPS-encrypted) once if absent — trust anchor for both clusters
    dir: '{{.TASKFILE_DIR}}/../..'
    status:
      - test -f clusters/_shared/cilium-ca.sops.yaml
    cmds:
      - '{{.TASKFILE_DIR}}/create-ca.sh'

  apply-shared-ca:
    summary: Apply the shared Cilium CA and make it adoptable by the Cilium Helm release
    dir: '{{.TASKFILE_DIR}}/../..'
    requires:
      vars: [CLUSTER]
    vars:
      KUBECONFIG_FILE: '{{.TASKFILE_DIR}}/../../generated/{{.CLUSTER}}/kubeconfig'
    preconditions:
      - sh: test -f clusters/_shared/cilium-ca.sops.yaml
        msg: "Shared CA missing: generate clusters/_shared/cilium-ca.sops.yaml first."
      - sh: test -f {{.KUBECONFIG_FILE}}
        msg: "kubeconfig missing at {{.KUBECONFIG_FILE}}."
    cmds:
      - |
        export KUBECONFIG='{{.KUBECONFIG_FILE}}'
        set -euo pipefail
        sops --decrypt --input-type yaml --output-type yaml \
          clusters/_shared/cilium-ca.sops.yaml /dev/stdin | kubectl apply -f -
        kubectl -n kube-system label secret cilium-ca \
          app.kubernetes.io/managed-by=Helm --overwrite
        kubectl -n kube-system annotate secret cilium-ca \
          meta.helm.sh/release-name=cilium \
          meta.helm.sh/release-namespace=kube-system --overwrite

  clustermesh-status:
    summary: Read-only ClusterMesh health for a cluster
    requires:
      vars: [CLUSTER]
    vars:
      KUBECONFIG_FILE: '{{.TASKFILE_DIR}}/../../generated/{{if eq .CLUSTER "application"}}application/kubeconfig{{else}}mlops/kubeconfig{{end}}'
    cmds:
      - |
        export KUBECONFIG='{{.KUBECONFIG_FILE}}'
        kubectl -n kube-system get svc clustermesh-apiserver
        kubectl -n kube-system get secret cilium-clustermesh --ignore-not-found
        kubectl -n kube-system exec ds/cilium -- cilium-dbg status --verbose | grep -A6 ClusterMesh || true
