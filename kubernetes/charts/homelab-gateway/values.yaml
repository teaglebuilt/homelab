---
external:
  publicGateway: false
  frontDoor: false
  tunnelHostnames:
    - n8n

hubbleRoute:
  # application owns hubble.homelab.internal; set to false on mlops so both
  # clusters' external-dns do not fight over the same A record with different targets.
  enabled: true

ghcrSecret:
  enabled: true
  namespace: default          # where ghcr-credentials lives and ghcr-secret is created
  sourceSecret: ghcr-credentials
  targetSecret: ghcr-secret
  image: bitnamilegacy/kubectl:1.33.4

kgateway-crds:
  controller:
    image:
      pullPolicy: Always

# agentgateway / inferenceExtension are no longer subfeatures of the kgateway
# chart (removed by v2.4). agentgateway-crds is installed separately via
# platform/ai Taskfile.
kgateway:
  controller:
    image:
      pullPolicy: Always
    deployment:
      extraArgs:
        - --zap-log-level=info
