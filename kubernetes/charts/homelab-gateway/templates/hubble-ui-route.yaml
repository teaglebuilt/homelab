---
{{- $hubbleHost := .Values.hubble.hostname | default (printf "hubble-%s.homelab.internal" .Values.cluster) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui-route
  namespace: kube-system
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ $hubbleHost | quote }}
spec:
  parentRefs:
  - name: homelab-internal-gateway
    namespace: kube-system
  hostnames:
    - {{ $hubbleHost | quote }}
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: "/"
      backendRefs:
      - name: hubble-ui
        port: 80
    # - matches:
    #   - path:
    #       type: PathPrefix
    #       value: "/metrics"
    #   backendRefs:
    #   - name: hubble-metrics
    #     port: 9965
